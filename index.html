    '</div>'+
    '<div id="mm-bar" style="position:sticky;bottom:0;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.10);z-index:5"></div>'+
    '<div style="height:22px"></div>'+
    '<div class="toolbar"><div class="sec-title" style="margin:0">Zugeordnete Bewerber</div><div style="flex:1"></div>'+
      '<select onchange="state.filterCustomer=this.value;render()" style="padding:8px 11px;border:1px solid var(--line);border-radius:9px">'+custOpts+'</select></div>'+
    '<div class="card tablecard">'+
      tableBewerber(state.bewerber.filter(b=>bewIsAssigned(b)&&(state.filterCustomer==='all'||bewCustomerIds(b).includes(state.filterCustomer))),true)+
    '</div>';
  mmBewList(); mmCustList(); mmBar();
}

/* ===================== SUPPORT (global) ===================== */
function viewSupport(){
  $('#pgActions').innerHTML='<button class="btn" onclick="addTicketModal(state.customers[0]&&state.customers[0].id)">+ Ticket</button>';
  const groups=TICKET_STATUS.map(s=>({s,items:state.tickets.filter(t=>t.status===s.v)}));
  const open=state.tickets.filter(t=>t.status!=='geloest');
  $('#content').innerHTML=
    '<div class="stats" style="grid-template-columns:repeat(4,1fr)">'+
      TICKET_STATUS.map(s=>stat(state.tickets.filter(t=>t.status===s.v).length,s.l)).join('')+
    '</div>'+
    (state.tickets.length?
      '<div class="card tablecard"><table><thead><tr><th>Betreff</th><th>Kunde</th><th class="hide-sm">Prio</th><th>Status</th><th class="hide-sm">Datum</th></tr></thead><tbody>'+
      state.tickets.map(t=>{const ts=lookup(TICKET_STATUS,t.status);return '<tr onclick="openTicket(\''+t.id+'\')"><td><b>'+esc(t.betreff)+'</b></td>'+
        '<td>'+esc(cust(t.customer_id)?.name||'\u2014')+'</td>'+
        '<td class="hide-sm"><span class="tk-prio '+esc(t.prio)+'"></span> '+esc(t.prio)+'</td>'+
        '<td><span class="tag-s '+ts.c+'">'+esc(ts.l)+'</span></td>'+
        '<td class="hide-sm muted">'+fmtDate(t.created_at)+'</td></tr>';}).join('')+'</tbody></table></div>'
      : empty('\u2691','Keine Tickets','Support-Anfragen der Kunden erscheinen hier.'));
}
function openTicket(id){
  const t=state.tickets.find(x=>x.id===id); if(!t)return;
  openModal({title:esc(t.betreff),
    body:
      '<div class="kv" style="margin-bottom:14px">'+row('Kunde',cust(t.customer_id)?.name)+row('Prio',t.prio)+row('Erstellt',fmtDate(t.created_at))+'</div>'+
      '<div class="frow"><label>Status</label><select id="tk-status">'+TICKET_STATUS.map(s=>'<option value="'+s.v+'"'+(s.v===t.status?' selected':'')+'>'+s.l+'</option>').join('')+'</select></div>'+
      '<div class="frow"><label>Beschreibung</label><textarea id="tk-desc">'+esc(t.beschreibung||'')+'</textarea></div>',
    footer:'<button class="btn danger sm" onclick="deleteTicket(\''+id+'\')">Löschen</button><div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Schließen</button><button class="btn" onclick="updateTicket(\''+id+'\')">Speichern</button>'});
}
async function updateTicket(id){
  const res=await sb.from('support_tickets').update({status:$('#tk-status').value,beschreibung:$('#tk-desc').value.trim()}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('tickets'); closeModal(); render(); toast('Ticket gespeichert');
}
async function deleteTicket(id){
  if(!confirm('Ticket löschen?'))return;
  const res=await sb.from('support_tickets').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('tickets'); closeModal(); render(); toast('Ticket gelöscht');
}

/* ===================== LOGINS & TEAM (global) ===================== */
function viewLogins(){
  $('#pgActions').innerHTML='<button class="btn" onclick="createLoginModal(null)">+ Login anlegen</button>';
  const admins=state.users.filter(u=>u.role==='gc_admin');
  const owners=state.users.filter(u=>u.role!=='gc_admin');
  const block=(title,arr,isAdmin)=> '<div class="card tablecard" style="margin-bottom:18px"><div class="cardh"><b>'+title+'</b><span class="tag-s '+(isAdmin?'blue':'gray')+'" style="margin-left:4px">'+arr.length+'</span></div>'+
    (arr.length? arr.map(u=>'<div class="listrow"><div class="av" style="width:36px;height:36px;border-radius:10px;font-size:14px">'+esc(initials(u.name||u.email))+'</div>'+
      '<div class="lt"><b>'+esc(u.name||u.email)+'</b><small>'+esc(u.email)+(u.customer_id?' \u00B7 '+esc(cust(u.customer_id)?.name||'?'):'')+'</small></div>'+
      '<button class="btn ghost sm" onclick="resetLogin(\''+u.id+'\')">Passwort</button>'+
      (u.id===state.profile.id?'<span class="tag-s green">Du</span>':'<button class="btn danger sm" onclick="deleteLogin(\''+u.id+'\')">Entfernen</button>')+
      '</div>').join('') : '<div class="cardp muted" style="font-size:13.5px">Keine Einträge.</div>')+'</div>';
  $('#content').innerHTML=
    '<div class="card" style="padding:13px 16px;margin-bottom:18px"><span class="muted" style="font-size:13.5px">Logins anlegen, Passwörter setzen und Zugänge entfernen. Owner-Logins gehören zu einem Kunden, GC-Admins haben Vollzugriff.</span></div>'+
    block('GreenCareers-Team (Admins)',admins,true)+
    block('Kunden-Logins (Inhaber)',owners,false);
}

/* ===================== UI PRIMITIVES ===================== */
function toolbar(ph){
  return '<div class="toolbar"><div class="search"><span class="si">\u2315</span>'+
    '<input placeholder="'+esc(ph)+'" value="'+esc(state.search)+'" oninput="state.search=this.value;render()" autofocus></div></div>';
}
function empty(ic,t,s){return '<div class="empty"><div class="big">'+ic+'</div><b>'+esc(t)+'</b><div class="muted" style="margin-top:4px">'+esc(s)+'</div></div>';}
function openModal({title,body,footer,wide}){
  $('#modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal'+(wide?' wide':'')+'"><div class="modal-h"><h3>'+esc(title)+'</h3><button class="x" onclick="closeModal()">\u00D7</button></div>'+
    '<div class="modal-b">'+body+'</div><div class="modal-f">'+(footer||'')+'</div></div></div>';
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

init();
</script>
