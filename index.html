<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GreenCareers OS Backend</title>
<style>
:root{
  --green:#16A34A; --green-2:#15803D; --ink:#0B1A12; --ink-2:#10231A;
  --sidebar:#0C1B13; --sidebar-2:#102619; --sidebar-text:#9DBCA8;
  --canvas:#F4F6F4; --card:#FFFFFF; --line:#E3E8E3; --line-2:#EDF1ED;
  --text:#16261C; --muted:#6B7C70; --soft:#EAF6EE; --danger:#DC2626;
  --radius:14px; --shadow:0 1px 3px rgba(16,38,25,.06),0 8px 24px rgba(16,38,25,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--canvas);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--green);text-decoration:none}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#16341f 0%,var(--ink) 60%);padding:24px;z-index:50}
.loginbox{width:100%;max-width:400px;background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);padding:34px 30px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:17px;letter-spacing:-.2px}
.loginbox .tag{display:inline-block;margin:4px 0 22px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-2);background:var(--soft);padding:4px 9px;border-radius:999px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--green);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #F1C7C7}
.btn.danger:hover{background:#FEF2F2}
.loginmsg{margin-top:12px;font-size:13px;min-height:18px}
.loginmsg.err{color:var(--danger)}
.loginmsg.ok{color:var(--green-2)}
.loginlink{margin-top:14px;text-align:center;font-size:13px}
.loginlink a{cursor:pointer;font-weight:600}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.sidebar .top{padding:20px 18px 14px}
.sidebar .brand b{color:#fff}
.sidebar .brand .dot{background:var(--green)}
.sidebar .env{font-size:11px;color:#5f7a68;margin-top:8px;padding-left:2px}
.nav{padding:8px 12px;flex:1;overflow:auto}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sidebar-text);font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:2px;transition:background .12s,color .12s}
.navitem:hover{background:var(--sidebar-2);color:#fff}
.navitem.active{background:var(--green);color:#fff}
.navitem .ic{width:18px;text-align:center;font-size:16px}
.navitem .ct{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;font-weight:700}
.sidebar .bottom{padding:14px;border-top:1px solid rgba(255,255,255,.06)}
.who{font-size:13px;color:#cfe3d6;margin-bottom:8px;word-break:break-all}
.who small{display:block;color:#6f8c79;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px;letter-spacing:-.3px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:24px 26px 60px;max-width:1180px;width:100%}

/* ---------- CARDS / TABLES ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:180px;position:relative}
.toolbar .search input{width:100%;padding:10px 13px 10px 36px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}
.toolbar .search input:focus{border-color:var(--green)}
.toolbar .search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
table{width:100%;border-collapse:collapse}
.tablecard{overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--line-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--soft)}
.tag-s{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.tag-s.green{background:var(--soft);color:var(--green-2)}
.tag-s.orange{background:#FEF0E6;color:#C2410C}
.tag-s.gold{background:#FBF3D8;color:#A16207}
.tag-s.blue{background:#E6F0FB;color:#1D5FB0}
.tag-s.gray{background:var(--line-2);color:var(--muted)}
.tag-s.red{background:#FEECEC;color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.muted{color:var(--muted)}
.right{text-align:right}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,26,18,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .15s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px;font-weight:800;letter-spacing:-.2px}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:18px;display:grid;place-items:center}
.modal-h .x:hover{background:var(--line-2)}
.modal-b{padding:22px 24px;max-height:64vh;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);background:var(--line-2);border-radius:0 0 18px 18px}
.modal-f .spacer{flex:1}
.frow{margin-bottom:15px}
.frow label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--green)}
.frow textarea{min-height:80px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.selchips{display:flex;flex-wrap:wrap;gap:7px}
.selchip{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--muted)}
.selchip.on{background:var(--soft);border-color:var(--green);color:var(--green-2)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.divider{height:1px;background:var(--line);margin:18px 0}
.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 10px}

/* ---------- WIZARD ---------- */
.wsteps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.wstep{flex:1;min-width:96px;display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;transition:.15s}
.wstep:hover{border-color:var(--green)}
.wstep .wn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center}
.wstep .wl{font-size:12.5px;font-weight:700;color:var(--muted);line-height:1.15}
.wstep.on{border-color:var(--green);background:var(--soft)}
.wstep.on .wn{background:var(--green);color:#fff}
.wstep.on .wl{color:var(--green-2)}
.wstep.done .wn{background:#e6f4ea;color:#1a7f37}
.wstep.done .wn::after{content:"✓"}
.wstep.done .wn{font-size:0}
.wstep.done .wn::after{font-size:12px}
.wpane{display:none}
.wpane.on{display:block;animation:pop .15s ease}
.werr{display:none;background:#fdecea;border:1px solid #f5c2bd;color:#b3261e;font-size:13px;font-weight:600;padding:10px 13px;border-radius:10px;margin-bottom:14px}
.werr.on{display:block}
.werr ul{margin:6px 0 0;padding-left:18px;font-weight:500}
.req{color:#b3261e}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bopt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);background:#fff;transition:.12s}
.bopt:hover{border-color:var(--green)}
.bopt.on{background:var(--soft);border-color:var(--green);color:var(--green-2)}
.bopt .bx{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.bopt.on .bx{background:var(--green);border-color:var(--green)}
.summ{display:flex;flex-direction:column;gap:7px}
.summ .srow{display:flex;align-items:center;gap:9px;font-size:13.5px}
.summ .si{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.summ .si.ok{background:#e6f4ea;color:#1a7f37}
.summ .si.miss{background:#fcefc7;color:#9a6700}
.portal-link{font-size:12.5px;background:var(--line-2);border-radius:9px;padding:9px 11px;margin-top:12px;word-break:break-all}
/* ---- Datei-Upload ---- */
.uprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:.12s}
.upbtn:hover{border-color:var(--green);color:var(--green-2)}
.upbtn.busy{opacity:.6;pointer-events:none}
.upbtn input{display:none}
.uphint{font-size:12px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--line-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.wide{width:150px}
.thumb .thx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:6px;border:none;background:rgba(15,25,20,.72);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center}
.thumb .thx:hover{background:var(--danger)}
@media(max-width:860px){.bgrid{grid-template-columns:1fr}}

/* CSV preview */
.csvtable{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:240px}
.csvtable table{font-size:13px}
.csvtable th,.csvtable td{padding:8px 10px;white-space:nowrap}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.maprow .col{font-size:13px;font-weight:600;background:var(--line-2);padding:7px 10px;border-radius:8px;min-width:0}
.maprow.off{opacity:.5}
.maprow select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.maprow.ask{background:#fff8e6;border:1px solid #f3d27a;border-radius:10px;padding:8px;margin-left:-8px;margin-right:-8px}
.mapbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-top:4px}
.mapbadge.ok{background:#e6f4ea;color:#1a7f37}
.mapbadge.ask{background:#fcefc7;color:#9a6700}
.extragrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.extra-k{color:var(--muted);font-weight:600}
.extra-v{color:var(--text);word-break:break-word}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-2);color:#fff;padding:12px 18px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:80;animation:pop .15s ease}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 50px rgba(0,0,0,.4)}
  .sidebar.open{transform:translateX(0)}
  .menubtn{display:grid!important}
  .stats{grid-template-columns:repeat(2,1fr)}
  .content{padding:18px 16px 60px}
  .topbar{padding:14px 16px}
  .frow2{grid-template-columns:1fr}
  .hide-sm{display:none}
}
.menubtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;place-items:center;font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}

/* ---------- DETAIL / COCKPIT ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;cursor:pointer}
.backlink:hover{color:var(--green-2)}
.dhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.dhead .av{width:54px;height:54px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0}
.dhead h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.dhead .meta{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cardh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cardh b{font-size:15px}
.cardh .btn{margin-left:auto}
.cardp{padding:16px 18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;font-size:14px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{color:var(--text);word-break:break-word}
.modgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
.modrow .mt{flex:1;min-width:0}
.modrow .mt b{font-size:14px;display:block}
.modrow .mt small{color:var(--muted);font-size:11.5px}
.switch{position:relative;width:40px;height:23px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd8d0;border-radius:999px;transition:.18s;cursor:pointer}
.slider:before{content:'';position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(17px)}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.listrow:last-child{border-bottom:none}
.listrow .lt{flex:1;min-width:0}
.listrow .lt b{font-size:14px}
.listrow .lt small{display:block;color:var(--muted);font-size:12px}
.tk-prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tk-prio.niedrig{background:#9CA3AF}.tk-prio.mittel{background:#16A34A}.tk-prio.hoch{background:#EA580C}.tk-prio.dringend{background:#DC2626}
.stars{display:inline-flex;gap:2px}
.star{cursor:pointer;font-size:18px;color:#D7DED8;line-height:1}
.star.on{color:#F5B301}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.tagpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--green-2)}
.tagpill .rm{cursor:pointer;opacity:.6}.tagpill .rm:hover{opacity:1}
/* Kanban */
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--line-2);border-radius:13px;min-height:120px;display:flex;flex-direction:column}
.kcolh{padding:11px 13px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;align-items:center;gap:7px;position:sticky;top:0}
.kcolh .n{margin-left:auto;background:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.kcol.drag{outline:2px dashed var(--green);outline-offset:-3px}
.kbody{padding:0 9px 9px;display:flex;flex-direction:column;gap:8px;flex:1}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(16,38,25,.05)}
.kcard:active{cursor:grabbing}
.kcard b{font-size:13.5px}
.kcard .sub{color:var(--muted);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .kf{display:flex;align-items:center;gap:6px;margin-top:7px}
.miniquelle{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.csvbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pwbox{background:var(--soft);border:1px solid #CDEBD8;border-radius:11px;padding:13px 15px;font-size:13.5px}
.pwbox code{background:#fff;border:1px solid var(--line);padding:3px 8px;border-radius:7px;font-weight:700;font-size:14px;letter-spacing:.5px}
@media(max-width:860px){.grid2,.modgrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="brand"><span class="dot">G</span><b>GreenCareers OS</b></div>
    <span class="tag">Backend · Intern</span>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field"><label>E-Mail</label><input id="li-email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Passwort</label><input id="li-pw" type="password" autocomplete="current-password" required></div>
      <button class="btn full" type="submit" id="li-btn">Anmelden</button>
      <div class="loginmsg" id="li-msg"></div>
      <div class="loginlink"><a onclick="showForgot()">Passwort vergessen?</a></div>
    </form>

    <!-- PASSWORT VERGESSEN -->
    <form id="forgotForm" class="hidden" onsubmit="doForgot(event)">
      <div class="field"><label>E-Mail</label><input id="fg-email" type="email" autocomplete="username" required></div>
      <button class="btn full" type="submit" id="fg-btn">Link zum Zuruecksetzen senden</button>
      <div class="loginmsg" id="fg-msg"></div>
      <div class="loginlink"><a onclick="showLoginForm()">Zurueck zum Login</a></div>
    </form>

    <!-- NEUES PASSWORT SETZEN (Recovery) -->
    <form id="recoverForm" class="hidden" onsubmit="doRecover(event)">

async function callAdmin(action,payload={}){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw new Error('Keine Session');
  const res=await fetch(SUPABASE_URL+'/functions/v1/admin-users',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON},
    body:JSON.stringify(Object.assign({action},payload))
  });
  let j={}; try{j=await res.json();}catch(e){}
  if(!res.ok||j.error) throw new Error(j.error||('HTTP '+res.status));
  return j;
}

/* ===================== AUTH ===================== */
let RECOVERY=false;
async function init(){
  // Recovery-Flow: Supabase haengt #access_token=...&type=recovery an die URL
  if(location.hash.includes('type=recovery')){
    RECOVERY=true;
    showLogin(); showRecover();
    history.replaceState(null,'',location.pathname+location.search);
    return;
  }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY'){ RECOVERY=true; showLogin(); showRecover(); } });
  const {data:{session}} = await sb.auth.getSession();
  if(session && !RECOVERY) await afterLogin(); else showLogin();
}
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }

/* ---- Login / Forgot / Recover Umschalter ---- */
function showLoginForm(){
  $('#loginForm').classList.remove('hidden');
  $('#forgotForm').classList.add('hidden'); $('#recoverForm').classList.add('hidden');
}
function showForgot(){
  $('#loginForm').classList.add('hidden'); $('#recoverForm').classList.add('hidden');
  $('#forgotForm').classList.remove('hidden');
  $('#fg-email').value = $('#li-email').value.trim();
  $('#fg-msg').className='loginmsg'; $('#fg-msg').textContent='';
}
function showRecover(){
  $('#loginForm').classList.add('hidden'); $('#forgotForm').classList.add('hidden');
  $('#recoverForm').classList.remove('hidden');
}

async function doForgot(e){
  e.preventDefault();
  const msg=$('#fg-msg'), btn=$('#fg-btn');
  const email=$('#fg-email').value.trim();
  msg.className='loginmsg'; msg.textContent=''; btn.disabled=true; btn.textContent='Sende...';
  const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  btn.disabled=false; btn.textContent='Link zum Zuruecksetzen senden';
  if(error){ msg.className='loginmsg err'; msg.textContent='Fehler: '+error.message; return; }
  msg.className='loginmsg ok';
  msg.textContent='Falls ein Konto mit dieser E-Mail existiert, ist ein Link zum Zuruecksetzen unterwegs. Bitte Postfach (und Spam) pruefen.';
}

async function doRecover(e){
  e.preventDefault();
  const msg=$('#rc-msg'), btn=$('#rc-btn');
  const pw=$('#rc-pw').value, pw2=$('#rc-pw2').value;
  msg.className='loginmsg'; msg.textContent='';
  if(pw.length<8){ msg.className='loginmsg err'; msg.textContent='Passwort muss mindestens 8 Zeichen haben.'; return; }
  if(pw!==pw2){ msg.className='loginmsg err'; msg.textContent='Die beiden Passwoerter stimmen nicht ueberein.'; return; }
  btn.disabled=true; btn.textContent='Speichere...';
  const {error} = await sb.auth.updateUser({password:pw});
  btn.disabled=false; btn.textContent='Neues Passwort speichern';
  if(error){ msg.className='loginmsg err'; msg.textContent='Fehler: '+error.message; return; }
  RECOVERY=false;
  msg.className='loginmsg ok'; msg.textContent='Passwort gespeichert. Du wirst angemeldet...';
  await afterLogin();
}

async function doLogin(e){
  e.preventDefault();
  const msg=$('#li-msg'); const btn=$('#li-btn');
  msg.className='loginmsg'; msg.textContent=''; btn.disabled=true; btn.textContent='Pruefe...';
  const email=$('#li-email').value.trim(); const pw=$('#li-pw').value;
  const {error} = await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false; btn.textContent='Anmelden';
  if(error){ msg.className='loginmsg err'; msg.textContent='Login fehlgeschlagen: '+error.message; return; }
  await afterLogin();
}

async function afterLogin(){
  const {data:{user}} = await sb.auth.getUser();
  const {data:prof,error} = await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error || !prof){ await sb.auth.signOut(); $('#li-msg').className='loginmsg err'; $('#li-msg').textContent='Kein Profil gefunden.'; showLogin(); return; }
  if(prof.role!=='gc_admin'){
    await sb.auth.signOut(); showLogin();
    $('#li-msg').className='loginmsg err';
    $('#li-msg').textContent='Dieser Login ist nur fuer GreenCareers-Mitarbeiter (gc_admin).';
    return;
  }
  state.profile=prof;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').innerHTML='<b>'+esc(prof.name||prof.email)+'</b><small>GC-Admin · Vollzugriff</small>';
  $('#content').innerHTML='<div class="empty"><div class="big">\u25CC</div><b>Daten werden geladen\u2026</b></div>';
  await loadAll();
  setView('dashboard');
}

async function saveCustomerField(id,field,val){
  if(field==='mrr') val=Number(val)||0;
  if(field==='betrag') val=(val===''||val==null)?null:(Number(val)||0);
  if(field==='vertrag_start' && !val) val=null;
  if(['kauftyp','produkt','laufzeit','zahlungsart'].includes(field) && val==='') val=null;
  const res=await sb.from('customers').update({[field]:val}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  // Kauftyp aendert die Sichtbarkeit von Laufzeit -> Cockpit neu rendern
  await reload('customers'); render(); toast('Gespeichert');
}

  const c=cust(id); const mods=Object.assign(defaultModules(),c.modules||{}); mods[mod]=on;
  const res=await sb.from('customers').update({modules:mods}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('customers'); toast((on?'Freigeschaltet: ':'Gesperrt: ')+mod);
}

/* ===================== DATEI-UPLOAD (Supabase Storage) ===================== */
const MEDIA_BUCKET='portal-media';
let CUP={}, WMP={};   // CUP=Kunden-Bilder, WMP=Stellen-Bilder (Form-Zwischenstand)
async function uploadMedia(file, folder){
  const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
  const base=(folder||'misc').replace(/[^a-z0-9_\/-]/gi,'-');
  const path=base+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const {error}=await sb.storage.from(MEDIA_BUCKET).upload(path,file,{upsert:true,cacheControl:'3600',contentType:file.type||undefined});
  if(error) throw error;
  return sb.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function pickSingle(input, obj, key, folder, rerenderFn){
  const f=input.files&&input.files[0]; if(!f) return;
  const btn=input.closest('.upbtn'); if(btn) btn.classList.add('busy');
  try{ obj[key]=await uploadMedia(f,folder); rerenderFn(); }
  catch(e){ toast('Upload fehlgeschlagen: '+(e.message||e)); }
  finally{ if(btn) btn.classList.remove('busy'); input.value=''; }
}
async function pickMulti(input, arr, folder, rerenderFn){
  const files=[...(input.files||[])]; if(!files.length) return;
  const btn=input.closest('.upbtn'); if(btn) btn.classList.add('busy');
  try{ for(const f of files){ arr.push(await uploadMedia(f,folder)); } rerenderFn(); }
  catch(e){ toast('Upload fehlgeschlagen: '+(e.message||e)); }
  finally{ if(btn) btn.classList.remove('busy'); input.value=''; }
}

/* PLZ -> Ort automatisch befuellen (nur wenn Ort leer; bleibt editierbar) */
async function plzAutofill(){
  const plzEl=$('#c-plz'), ortEl=$('#c-ort');
  if(!plzEl||!ortEl) return;
  const plz=plzEl.value.trim();
  if(!/^\d{5}$/.test(plz) || ortEl.value.trim()) return;
  try{
    const r=await fetch('https://api.zippopotam.us/de/'+plz);
    if(!r.ok) return;
    const d=await r.json();
    const place=d&&d.places&&d.places[0]&&d.places[0]['place name'];
    if(place && !ortEl.value.trim()) ortEl.value=place;
  }catch(e){/* offline o.ae. -> stiller Fallback, Feld bleibt manuell */}
}

async function saveCustomer(id){

function wizCustChange(){
  const c=cust($('#s-cust').value); if(!c) return;
  if(!$('#s-ap').value) $('#s-ap').value=c.ansprechpartner||'';
  if(!$('#s-kmail').value) $('#s-kmail').value=c.email||'';
  if(!$('#s-ktel').value) $('#s-ktel').value=c.telefon||'';
}
function wizGo(n){
  n=Math.max(0,Math.min(WIZ.last,n)); WIZ.step=n; WIZ.visited[n]=true;
  document.querySelectorAll('.wpane').forEach(p=>p.classList.toggle('on',+p.dataset.step===n));
  document.querySelectorAll('.wstep').forEach((p,i)=>{p.classList.toggle('on',i===n);p.classList.toggle('done',i!==n&&WIZ.visited[i]&&wizStepDone(i));});
  $('#wiz-back').style.display = n===0?'none':'';
  $('#wiz-next').style.display = n===WIZ.last?'none':'';
  $('#wiz-save').style.display = n===WIZ.last?'':'none';
  $('#wizErr').classList.remove('on');
  if(n===WIZ.last) wizRenderSumm();
  const mb=document.querySelector('.modal-b'); if(mb) mb.scrollTop=0;
}
function wizStepDone(i){
  if(i===0) return !!($('#s-titel')&&$('#s-titel').value.trim());
  if(i===1) return !!($('#s-besch')&&$('#s-besch').value.trim());
  return true; // 2,3,4 optional
}
function wizErr(msg){const e=$('#wizErr');e.innerHTML=msg;e.classList.add('on');const mb=document.querySelector('.modal-b');if(mb)mb.scrollTop=0;}
function wizNext(){
  if(WIZ.step===0 && !$('#s-titel').value.trim()){return wizErr('Bitte gib einen <b>Stellentitel</b> ein \u2013 z.B. \u201eTiefbaufacharbeiter (m/w/d)\u201c.');}
  if(WIZ.step===1 && !$('#s-besch').value.trim()){return wizErr('Bitte beschreibe die Stelle kurz unter <b>Kurzbeschreibung</b> \u2013 das sieht der Bewerber zuerst.');}
  wizGo(WIZ.step+1);
}
function wizCollectBenefits(){
  const sel=[...document.querySelectorAll('#benGrid .bopt.on span:last-child')].map(s=>s.textContent.trim());
  const custom=$('#s-bencustom').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  return [...sel,...custom];
}
function wizRenderSumm(){
  const row=(ok,label,hint)=>'<div class="srow"><span class="si '+(ok?'ok':'miss')+'">'+(ok?'\u2713':'!')+'</span><span>'+label+(ok?'':' <span class="muted">\u2013 '+hint+'</span>')+'</span></div>';
  const benN=wizCollectBenefits().length;
  const bilderN=(WMP.stellen_bilder||[]).length;
  $('#wizSumm').innerHTML=
    row(!!$('#s-titel').value.trim(),'Stellentitel','Pflicht (Schritt 1)')+
    row(!!$('#s-besch').value.trim(),'Kurzbeschreibung','Pflicht (Schritt 2)')+
    row(!!$('#s-aufgaben').value.trim(),'Aufgaben','empfohlen (Schritt 2)')+
    row(!!$('#s-profil').value.trim(),'Anforderungen','empfohlen (Schritt 2)')+
    row(benN>0,benN+' Benefits ausgewaehlt','empfohlen (Schritt 3)')+
    row(!!$('#s-ap').value.trim(),'Ansprechpartner','empfohlen (Schritt 4)')+
    row(bilderN>0,bilderN+' Stellen-Bilder','optional');
}
function slugify(t){
  return (t||'stelle').toLowerCase()
    .replace(/[\u00e4]/g,'ae').replace(/[\u00f6]/g,'oe').replace(/[\u00fc]/g,'ue').replace(/[\u00df]/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)
    +'-'+Math.random().toString(36).slice(2,8);
}
async function saveStelle(id){
  const titel=$('#s-titel').value.trim();
  if(!titel){wizGo(0);return wizErr('Bitte gib einen <b>Stellentitel</b> ein (Schritt 1).');}
  if(!$('#s-besch').value.trim()){wizGo(1);return wizErr('Bitte fuelle die <b>Kurzbeschreibung</b> aus (Schritt 2).');}
  const status=$('#s-status').value;
  const benefitsList=wizCollectBenefits();
  const stellenBilder=(WMP.stellen_bilder||[]).filter(Boolean);
  const payload={titel,customer_id:$('#s-cust').value,branche:$('#s-branche').value.trim(),
    ort:$('#s-ort').value.trim(),status,beschreibung:$('#s-besch').value.trim(),
    beschaeftigungsart:$('#s-art').value,vertragsart:$('#s-vt').value,
    gehalt:$('#s-gehalt').value.trim(),eintritt:$('#s-eintritt').value.trim(),
    aufgaben:$('#s-aufgaben').value.trim(),profil:$('#s-profil').value.trim(),
    benefits:benefitsList.join('\n'),benefits_list:benefitsList,stellen_bilder:stellenBilder,
    ansprechpartner:$('#s-ap').value.trim(),ansprechpartner_rolle:$('#s-aprolle').value.trim(),
    ansprechpartner_foto:WMP.ansprechpartner_foto||null,
    kontakt_email:$('#s-kmail').value.trim(),kontakt_telefon:$('#s-ktel').value.trim()};
  if(status==='aktiv') payload.published_at=new Date().toISOString();
  const btn=$('#wiz-save'); if(btn){btn.disabled=true;btn.textContent='Speichern \u2026';}
  let res;
  if(id){
    res=await sb.from('stellenanzeigen').update(payload).eq('id',id);
  }else{
    payload.slug=slugify(titel);
    res=await sb.from('stellenanzeigen').insert(payload);
  }
  if(res.error){if(btn){btn.disabled=false;btn.textContent=id?'Speichern':'Stelle anlegen';}return wizErr('Fehler beim Speichern: '+esc(res.error.message));}
  await reload('stellen'); closeModal(); render(); toast(id?'Stelle gespeichert':'Stelle angelegt');
}
async function deleteStelle(id){
  if(!confirm('Stelle loeschen?'))return;
  const res=await sb.from('stellenanzeigen').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('stellen'); closeModal(); render(); toast('Stelle geloescht');
}

/* ===================== CSV-IMPORT (flexibel: alle Spalten waehlbar) ===================== */
// Zielfelder. 'extra' = als Zusatzinfo im JSONB-Feld speichern (Spaltenname = Schluessel).
const CSV_TARGETS=[
  {v:'skip',    l:'\u2014 nicht importieren'},
  {v:'name',    l:'Name (komplett) *'},
  {v:'vorname', l:'Vorname *'},
  {v:'nachname',l:'Nachname *'},
  {v:'email',   l:'E-Mail'},
  {v:'telefon', l:'Telefon'},
  {v:'position',l:'Position / gesuchte Stelle'},
  {v:'ort',     l:'Ort'},
  {v:'plz',     l:'PLZ'},
  {v:'erfahrung',l:'Berufserfahrung'},
  {v:'quelle',  l:'Quelle'},
  {v:'status',  l:'Status'},
  {v:'extra',   l:'Als Zusatzinfo speichern'}
];
// Semantische Felder, die als saubere Schluessel ins JSONB "extra" wandern.
const CSV_EXTRA_KEYS={position:'Position',ort:'Ort',plz:'PLZ',erfahrung:'Berufserfahrung'};
// Felder, die nur einmal vergeben werden duerfen.
const CSV_UNIQUE=['name','vorname','nachname','email','telefon','position','ort','plz','erfahrung','quelle','status'];
let CSV={rows:[],headers:[],cols:[],conf:[]}; // cols[i]=Zielfeld, conf[i]='high'|'low' pro Spalte
function openCsvImport(){
  openModal({
    title:'Bewerber importieren', wide:true,
    body:
      '<div class="frow"><label>CSV-/Tabellen-Datei</label><input type="file" id="csv-file" accept=".csv,text/csv,.tsv,text/tab-separated-values" onchange="csvFile(event)"></div>'+
      '<div class="hint">Oder Inhalt direkt einfuegen (aus Google Sheets / Excel kopieren = Tab-getrennt, geht auch):</div>'+
      '<div class="frow"><textarea id="csv-text" placeholder="Erste Zeile = Spaltennamen" oninput="csvParse(this.value)"></textarea></div>'+
      '<div id="csv-preview"></div>',
    footer:'<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Abbrechen</button>'+
      '<button class="btn" id="csv-go" onclick="csvImport()" disabled>Importieren</button>'
  });
}
function csvFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csv-text').value=r.result;csvParse(r.result);};r.readAsText(f);}
function csvParse(text){
  text=(text||'').replace(/\s+$/,''); const prev=$('#csv-preview');
  if(!text){if(prev)prev.innerHTML='';CSV={rows:[],headers:[],cols:[],conf:[]};$('#csv-go').disabled=true;return;}
  const first=text.split('\n')[0];
  const sep = first.includes('\t')?'\t':first.includes(';')?';':',';
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out.map(x=>x.trim());};
  const headers=split(lines[0]);
  const rows=lines.slice(1).map(l=>split(l));
  const m=autoMap(headers);
  CSV={headers,rows,cols:m.cols,conf:m.conf};
  renderCsvPreview();
}
// Liefert pro Spalte Default-Ziel + Konfidenz ('high'=sicher erkannt, 'low'=bitte pruefen).
function autoMap(headers){
  const used={};
  const cols=[],conf=[];
  headers.forEach(h=>{
    // Spaltenname normalisieren: Sonderzeichen -> Leerzeichen
    const l=h.toLowerCase().replace(/[?_]/g,' ').replace(/\s+/g,' ').trim();
    let t='extra',c='low';
    if(!used.name && /\bfull ?name\b|^name$|bewerbername|^bewerber$/.test(l)){t='name';c='high';}
    else if(!used.vorname && /vor ?name/.test(l)){t='vorname';c='high';}
    else if(!used.nachname && /nach ?name/.test(l)){t='nachname';c='high';}
    else if(!used.email && /e-?mail/.test(l)){t='email';c='high';}
    else if(!used.telefon && /(phone|telefon|handy|mobil|rufnummer|\bnumber\b)/.test(l)){t='telefon';c='high';}
    else if(!used.ort && /wo suchst/.test(l)){t='ort';c='low';}   // "wo suchst du... (ort oder plz)" -> mehrdeutig, vor PLZ pruefen
    else if(!used.plz && /(plz|postleitzahl)/.test(l)){t='plz';c='high';}
    else if(!used.ort && /(^ort$|\bort\b|wohnort|stadt|standort)/.test(l)){t='ort';c='high';}
    else if(!used.position && /(interessant|gesuchte stelle|stellenwunsch)/.test(l)){t='position';c='high';}
    else if(!used.position && /(position|^stelle$|stellen)/.test(l)){t='position';c='high';}
    else if(!used.position && /fachrichtung/.test(l)){t='position';c='low';} // Kategorie, nicht exakte Rolle -> pruefen
    else if(!used.erfahrung && /(berufserfahrung|erfahrung)/.test(l)){t='erfahrung';c='low';} // Inhalt variiert je Quelle -> pruefen
    else if(!used.quelle && /(platform|quelle|^source$)/.test(l)){t='quelle';c='high';}
    else if(!used.status && /(lead ?status|^status$)/.test(l)){t='status';c='high';}
    // technische Meta-/Form-Felder standardmaessig nicht importieren
    else if(/(^id$| id$|created time|is organic|ad name|adset|campaign|form id|form name|zeitstempel)/.test(l)){t='skip';c='high';}
    else {t='extra';c='low';}
    if(CSV_UNIQUE.includes(t)) used[t]=true;
    cols.push(t); conf.push(c);
  });
  return {cols,conf};
}
function csvSet(i,v){
  // Unique-Felder sind 1x vergeben -> bei Doppelung andere zuruecksetzen
  if(CSV_UNIQUE.includes(v)){
    CSV.cols=CSV.cols.map((c,idx)=> (idx!==i && c===v)? 'extra' : c);
  }
  CSV.cols[i]=v; CSV.conf[i]='high'; // manuell gesetzt = bestaetigt
  renderCsvPreview();
}
function renderCsvPreview(){
  const prevC=$('#csv-cust')?.value||'';
  const custOpts='<option value="">\u2014 spaeter zuordnen</option>'+state.customers.map(c=>'<option value="'+c.id+'"'+(String(c.id)===prevC?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  const prevQ=$('#csv-quelle')?.value||'';
  const quOpts='<option value="">\u2014 aus Spalte / automatisch</option>'+QUELLE.map(q=>'<option value="'+q+'"'+(q===prevQ?' selected':'')+'>'+(QUELLE_LABEL[q]||q)+'</option>').join('');
  const nImp=CSV.cols.filter(c=>c!=='skip').length;
  const hasName=CSV.cols.includes('name')||(CSV.cols.includes('vorname')&&CSV.cols.includes('nachname'));
  const nAsk=CSV.cols.filter((c,i)=>c!=='skip'&&CSV.conf[i]==='low').length;
  const rowsHtml=CSV.headers.map((h,i)=>{
    const sample=(CSV.rows.find(r=>(r[i]||'').trim())||[])[i]||'';
    const sel=CSV.cols[i];
    const ask=sel!=='skip'&&CSV.conf[i]==='low';
    const opts=CSV_TARGETS.map(t=>'<option value="'+t.v+'"'+(t.v===sel?' selected':'')+'>'+t.l+'</option>').join('');
    const badge = sel==='skip' ? ''
      : ask ? '<span class="mapbadge ask">? bitte pruefen</span>'
            : '<span class="mapbadge ok">\u2713 erkannt</span>';
    return '<div class="maprow'+(sel==='skip'?' off':'')+(ask?' ask':'')+'">'+
      '<div class="col"><b>'+esc(h)+'</b><div class="muted" style="font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(sample)+'</div>'+badge+'</div>'+
      '<select onchange="csvSet('+i+',this.value)">'+opts+'</select></div>';
  }).join('');
  $('#csv-preview').innerHTML=
    '<div class="divider"></div>'+
    '<div class="sec-title">Spalten zuordnen <span class="muted" style="text-transform:none;font-weight:500">('+nImp+' von '+CSV.headers.length+' aktiv \u00B7 '+CSV.rows.length+' Zeilen)</span></div>'+
    (nAsk?'<div class="hint" style="background:#fff8e6;border:1px solid #f3d27a;border-radius:8px;padding:8px 10px;margin-bottom:10px;color:#9a6700"><b>'+nAsk+' Spalte'+(nAsk>1?'n':'')+' unklar.</b> Gelb markierte Spalten bitte pruefen \u2013 stimmt die Zuordnung?</div>':'')+
    '<div class="hint" style="margin-bottom:10px">Pro Spalte waehlen: Standardfeld, "Zusatzinfo" (bleibt am Bewerber gespeichert) oder "nicht importieren". Vorname + Nachname werden automatisch zu einem Namen zusammengefuegt.</div>'+
    rowsHtml+
    '<div class="frow" style="margin-top:14px"><label>Quelle fuer alle Zeilen</label><select id="csv-quelle" onchange="renderCsvPreview()">'+quOpts+'</select></div>'+
    '<div class="hint" style="margin-top:-6px;margin-bottom:10px">Bei Indeed/Meta gibt es oft keine brauchbare Quelle-Spalte \u2013 hier fuer den ganzen Import festlegen.</div>'+
    '<div class="frow"><label>Alle diesem Kunden zuordnen (optional)</label><select id="csv-cust">'+custOpts+'</select></div>'+
    (hasName?'':'<div class="hint" style="color:var(--danger)">Mindestens "Name" \u2013 oder "Vorname" + "Nachname" \u2013 muss zugeordnet sein.</div>');
  $('#csv-go').disabled = !hasName;
}
function normQuelle(v){
  const l=(v||'').toLowerCase();
  if(/gehaltscheck|gehalts-?check/.test(l))return 'gehaltscheck';
  if(/ig|insta|fb|face|meta/.test(l))return 'meta';
  if(/indeed/.test(l))return 'indeed';
  if(/web/.test(l))return 'website';
  if(QUELLE.includes(l))return l;
  return 'csv';
}
function cleanPhone(v){
  return (v||'').replace(/^p:/i,'').replace(/[^\d+ ()/-]/g,'').replace(/\s+/g,' ').trim();
}
function normStatus(v){
  const l=(v||'').toLowerCase();
  const hit=STATUS.find(s=>s.id===l||s.label.toLowerCase()===l);
  return hit?hit.id:'neu';
}
async function csvImport(){
  const hasName=CSV.cols.includes('name')||(CSV.cols.includes('vorname')&&CSV.cols.includes('nachname'));
  if(!hasName){toast('Spalte "Name" (oder Vorname + Nachname) zuordnen');return;}
  const cid=$('#csv-cust')?.value||null;
  const quOver=$('#csv-quelle')?.value||'';
  const idx=t=>CSV.cols.indexOf(t);
  const payload=CSV.rows.map(r=>{
    const cell=t=>{const k=idx(t);return k>=0?(r[k]||'').trim():'';};
    // Name: komplett oder aus Vorname + Nachname
    const name = idx('name')>=0 ? cell('name') : [cell('vorname'),cell('nachname')].filter(Boolean).join(' ').trim();
    const extra={};
    // freie Zusatz-Spalten
    CSV.cols.forEach((c,i)=>{ if(c==='extra'){ const val=(r[i]||'').trim(); if(val) extra[CSV.headers[i]]=val; } });
    // semantische Felder unter sauberen Schluesseln
    Object.keys(CSV_EXTRA_KEYS).forEach(t=>{ const v=cell(t); if(v) extra[CSV_EXTRA_KEYS[t]]=v; });
    return {
      name,
      email:cell('email')||null,
      telefon: cleanPhone(cell('telefon'))||null,
      quelle: quOver ? quOver : (idx('quelle')>=0? normQuelle(cell('quelle')) : 'csv'),
      status: idx('status')>=0? normStatus(cell('status')) : 'neu',
      customer_id:cid||null,
      extra
    };
  }).filter(p=>p.name);
  if(!payload.length){toast('Keine gueltigen Zeilen (Name leer?)');return;}
  $('#csv-go').disabled=true; $('#csv-go').textContent='Importiere...';
  // in Batches zu 500 (grosse Sheets)
  let done=0;
  for(let i=0;i<payload.length;i+=500){
    const res=await sb.from('bewerber').insert(payload.slice(i,i+500));
    if(res.error){toast('Fehler: '+res.error.message);$('#csv-go').disabled=false;$('#csv-go').textContent='Importieren';return;}
    done+=Math.min(500,payload.length-i);
  }
  await reload('bewerber'); closeModal(); render(); toast(done+' Bewerber importiert');
}

      : empty('\u2705','Alles zugeordnet','Keine offenen Bewerber.'))+
    '</div>'+
    '<div style="height:22px"></div>'+
    '<div class="toolbar"><div class="sec-title" style="margin:0">Zugeordnete Bewerber</div><div style="flex:1"></div>'+
      '<select onchange="state.filterCustomer=this.value;render()" style="padding:8px 11px;border:1px solid var(--line);border-radius:9px">'+custOpts+'</select></div>'+
    '<div class="card tablecard">'+
      tableBewerber(state.bewerber.filter(b=>b.customer_id&&(state.filterCustomer==='all'||b.customer_id===state.filterCustomer)),true)+
    '</div>';
}
function mStelle(bid){
  const cid=$('#m-c-'+bid).value;
  const opts=state.stellen.filter(s=>s.customer_id===cid);
  $('#m-s-'+bid).innerHTML='<option value="">\u2014 keine Stelle</option>'+opts.map(s=>'<option value="'+s.id+'">'+esc(s.titel)+'</option>').join('');
}
async function mAssign(bid){
  const cid=$('#m-c-'+bid).value; if(!cid){toast('Kunde waehlen');return;}
  const sid=$('#m-s-'+bid).value||null;
  const res=await sb.from('bewerber').update({customer_id:cid,stellenanzeige_id:sid,status:'gesichtet'}).eq('id',bid);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('bewerber'); render(); toast('Bewerber zugeordnet');
}

/* ===================== SUPPORT (global) ===================== */
function viewSupport(){
  $('#pgActions').innerHTML='<button class="btn" onclick="addTicketModal(state.customers[0]&&state.customers[0].id)">+ Ticket</button>';
  const groups=TICKET_STATUS.map(s=>({s,items:state.tickets.filter(t=>t.status===s.v)}));
  const open=state.tickets.filter(t=>t.status!=='geloest');
  $('#content').innerHTML=
    '<div class="stats" style="grid-template-columns:repeat(4,1fr)">'+
      TICKET_STATUS.map(s=>stat(state.tickets.filter(t=>t.status===s.v).length,s.l)).join('')+
    '</div>'+
    (state.tickets.length?
      '<div class="card tablecard"><table><thead><tr><th>Betreff</th><th>Kunde</th><th class="hide-sm">Prio</th><th>Status</th><th class="hide-sm">Datum</th></tr></thead><tbody>'+
      state.tickets.map(t=>{const ts=lookup(TICKET_STATUS,t.status);return '<tr onclick="openTicket(\''+t.id+'\')"><td><b>'+esc(t.betreff)+'</b></td>'+
        '<td>'+esc(cust(t.customer_id)?.name||'\u2014')+'</td>'+
        '<td class="hide-sm"><span class="tk-prio '+esc(t.prio)+'"></span> '+esc(t.prio)+'</td>'+
        '<td><span class="tag-s '+ts.c+'">'+esc(ts.l)+'</span></td>'+
        '<td class="hide-sm muted">'+fmtDate(t.created_at)+'</td></tr>';}).join('')+'</tbody></table></div>'
      : empty('\u2691','Keine Tickets','Support-Anfragen der Kunden erscheinen hier.'));
}
function openTicket(id){
  const t=state.tickets.find(x=>x.id===id); if(!t)return;
  openModal({title:esc(t.betreff),
    body:
      '<div class="kv" style="margin-bottom:14px">'+row('Kunde',cust(t.customer_id)?.name)+row('Prio',t.prio)+row('Erstellt',fmtDate(t.created_at))+'</div>'+
      '<div class="frow"><label>Status</label><select id="tk-status">'+TICKET_STATUS.map(s=>'<option value="'+s.v+'"'+(s.v===t.status?' selected':'')+'>'+s.l+'</option>').join('')+'</select></div>'+
      '<div class="frow"><label>Beschreibung</label><textarea id="tk-desc">'+esc(t.beschreibung||'')+'</textarea></div>',
    footer:'<button class="btn danger sm" onclick="deleteTicket(\''+id+'\')">Loeschen</button><div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Schliessen</button><button class="btn" onclick="updateTicket(\''+id+'\')">Speichern</button>'});
}
async function updateTicket(id){
  const res=await sb.from('support_tickets').update({status:$('#tk-status').value,beschreibung:$('#tk-desc').value.trim()}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('tickets'); closeModal(); render(); toast('Ticket gespeichert');
}
async function deleteTicket(id){
  if(!confirm('Ticket loeschen?'))return;
  const res=await sb.from('support_tickets').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('tickets'); closeModal(); render(); toast('Ticket geloescht');
}

/* ===================== LOGINS & TEAM (global) ===================== */
function viewLogins(){
  $('#pgActions').innerHTML='<button class="btn" onclick="createLoginModal(null)">+ Login anlegen</button>';
  const admins=state.users.filter(u=>u.role==='gc_admin');
  const owners=state.users.filter(u=>u.role!=='gc_admin');
  const block=(title,arr,isAdmin)=> '<div class="card tablecard" style="margin-bottom:18px"><div class="cardh"><b>'+title+'</b><span class="tag-s '+(isAdmin?'blue':'gray')+'" style="margin-left:4px">'+arr.length+'</span></div>'+
    (arr.length? arr.map(u=>'<div class="listrow"><div class="av" style="width:36px;height:36px;border-radius:10px;font-size:14px">'+esc(initials(u.name||u.email))+'</div>'+
      '<div class="lt"><b>'+esc(u.name||u.email)+'</b><small>'+esc(u.email)+(u.customer_id?' \u00B7 '+esc(cust(u.customer_id)?.name||'?'):'')+'</small></div>'+
      '<button class="btn ghost sm" onclick="resetLogin(\''+u.id+'\')">Passwort</button>'+
      (u.id===state.profile.id?'<span class="tag-s green">Du</span>':'<button class="btn danger sm" onclick="deleteLogin(\''+u.id+'\')">Entfernen</button>')+
      '</div>').join('') : '<div class="cardp muted" style="font-size:13.5px">Keine Eintraege.</div>')+'</div>';
  $('#content').innerHTML=
    '<div class="card" style="padding:13px 16px;margin-bottom:18px"><span class="muted" style="font-size:13.5px">Logins anlegen, Passwoerter setzen und Zugaenge entfernen. Owner-Logins gehoeren zu einem Kunden, GC-Admins haben Vollzugriff.</span></div>'+
    block('GreenCareers-Team (Admins)',admins,true)+
    block('Kunden-Logins (Inhaber)',owners,false);
}

/* ===================== UI PRIMITIVES ===================== */
function toolbar(ph){
  return '<div class="toolbar"><div class="search"><span class="si">\u2315</span>'+
    '<input placeholder="'+esc(ph)+'" value="'+esc(state.search)+'" oninput="state.search=this.value;render()" autofocus></div></div>';
}
function empty(ic,t,s){return '<div class="empty"><div class="big">'+ic+'</div><b>'+esc(t)+'</b><div class="muted" style="margin-top:4px">'+esc(s)+'</div></div>';}
function openModal({title,body,footer,wide}){
  $('#modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal'+(wide?' wide':'')+'"><div class="modal-h"><h3>'+esc(title)+'</h3><button class="x" onclick="closeModal()">\u00D7</button></div>'+
    '<div class="modal-b">'+body+'</div><div class="modal-f">'+(footer||'')+'</div></div></div>';
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

init();
</script>
