<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GreenCareers OS Backend</title>
<style>
:root{
  --green:#16A34A; --green-2:#15803D; --ink:#0B1A12; --ink-2:#10231A;
  --sidebar:#0C1B13; --sidebar-2:#102619; --sidebar-text:#9DBCA8;
  --canvas:#F4F6F4; --card:#FFFFFF; --line:#E3E8E3; --line-2:#EDF1ED;
  --text:#16261C; --muted:#6B7C70; --soft:#EAF6EE; --danger:#DC2626;
  --radius:14px; --shadow:0 1px 3px rgba(16,38,25,.06),0 8px 24px rgba(16,38,25,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--canvas);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--green);text-decoration:none}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#16341f 0%,var(--ink) 60%);padding:24px;z-index:50}
.loginbox{width:100%;max-width:400px;background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);padding:34px 30px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:17px;letter-spacing:-.2px}
.loginbox .tag{display:inline-block;margin:4px 0 22px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-2);background:var(--soft);padding:4px 9px;border-radius:999px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--green);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #F1C7C7}
.btn.danger:hover{background:#FEF2F2}
.loginmsg{margin-top:12px;font-size:13px;min-height:18px}
.loginmsg.err{color:var(--danger)}
.loginmsg.ok{color:var(--green-2)}
.loginlink{margin-top:14px;text-align:center;font-size:13px}
.loginlink a{cursor:pointer;font-weight:600}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.sidebar .top{padding:20px 18px 14px}
.sidebar .brand b{color:#fff}
.sidebar .brand .dot{background:var(--green)}
.sidebar .env{font-size:11px;color:#5f7a68;margin-top:8px;padding-left:2px}
.nav{padding:8px 12px;flex:1;overflow:auto}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sidebar-text);font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:2px;transition:background .12s,color .12s}
.navitem:hover{background:var(--sidebar-2);color:#fff}
.navitem.active{background:var(--green);color:#fff}
.navitem .ic{width:18px;text-align:center;font-size:16px}
.navitem .ct{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;font-weight:700}
.sidebar .bottom{padding:14px;border-top:1px solid rgba(255,255,255,.06)}
.who{font-size:13px;color:#cfe3d6;margin-bottom:8px;word-break:break-all}
.who small{display:block;color:#6f8c79;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px;letter-spacing:-.3px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:24px 26px 60px;max-width:1180px;width:100%}

/* ---------- CARDS / TABLES ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:180px;position:relative}
.toolbar .search input{width:100%;padding:10px 13px 10px 36px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}
.toolbar .search input:focus{border-color:var(--green)}
.toolbar .search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
table{width:100%;border-collapse:collapse}
.tablecard{overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--line-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--soft)}
.tag-s{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.tag-s.green{background:var(--soft);color:var(--green-2)}
.tag-s.orange{background:#FEF0E6;color:#C2410C}
.tag-s.gold{background:#FBF3D8;color:#A16207}
.tag-s.blue{background:#E6F0FB;color:#1D5FB0}
.tag-s.gray{background:var(--line-2);color:var(--muted)}
.tag-s.red{background:#FEECEC;color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.muted{color:var(--muted)}
.right{text-align:right}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,26,18,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .15s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px;font-weight:800;letter-spacing:-.2px}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:18px;display:grid;place-items:center}
.modal-h .x:hover{background:var(--line-2)}
.modal-b{padding:22px 24px;max-height:64vh;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);background:var(--line-2);border-radius:0 0 18px 18px}
.modal-f .spacer{flex:1}
.frow{margin-bottom:15px}
.frow label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--green)}
.frow textarea{min-height:80px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.selchips{display:flex;flex-wrap:wrap;gap:7px}
.selchip{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--muted)}
.selchip.on{background:var(--soft);border-color:var(--green);color:var(--green-2)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.divider{height:1px;background:var(--line);margin:18px 0}
.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 10px}

/* ---------- WIZARD ---------- */
.wsteps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:18px}
.wstep{min-width:0;display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;transition:.15s;overflow:hidden}
.wstep:hover{border-color:var(--green)}
.wstep .wn{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center}
.wstep .wl{font-size:12px;font-weight:700;color:var(--muted);line-height:1.12;min-width:0;overflow-wrap:anywhere}
.wstep.on{border-color:var(--green);background:var(--soft)}
.wstep.on .wn{background:var(--green);color:#fff}
.wstep.on .wl{color:var(--green-2)}
.wstep.done .wn{background:#e6f4ea;color:#1a7f37}
.wstep.done .wn::after{content:"✓"}
.wstep.done .wn{font-size:0}
.wstep.done .wn::after{font-size:12px}
.wpane{display:none}
.wpane.on{display:block;animation:pop .15s ease}
.werr{display:none;background:#fdecea;border:1px solid #f5c2bd;color:#b3261e;font-size:13px;font-weight:600;padding:10px 13px;border-radius:10px;margin-bottom:14px}
.werr.on{display:block}
.werr ul{margin:6px 0 0;padding-left:18px;font-weight:500}
.req{color:#b3261e}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bopt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);background:#fff;transition:.12s}
.bopt:hover{border-color:var(--green)}
.bopt.on{background:var(--soft);border-color:var(--green);color:var(--green-2)}
.bopt .bx{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;color:#fff}
.bopt.on .bx{background:var(--green);border-color:var(--green)}
/* ---- Chip-Input (Aufgaben/Profil/Benefits) ---- */
.chipin{display:flex;gap:8px}
.chipin input{flex:1;min-width:0}
.chipadd{flex:none;border:1px solid var(--green);background:var(--soft);color:var(--green-2);font-weight:700;font-size:13px;padding:0 14px;border-radius:9px;cursor:pointer;transition:.12s;white-space:nowrap}
.chipadd:hover{background:var(--green);color:#fff}
.chiplist{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--green);color:var(--green-2);font-size:13px;font-weight:600;padding:6px 7px 6px 9px;border-radius:9px}
.chip .cx{flex:none;width:17px;height:17px;border-radius:5px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:11px}
.chip .crm{flex:none;border:none;background:none;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
.chip .crm:hover{color:#c0392b}
.chip.pop{animation:chipPop .32s ease}
@keyframes chipPop{0%{transform:scale(.7);opacity:0}55%{transform:scale(1.08);background:#d8f3e0}100%{transform:scale(1);opacity:1}}
.summ{display:flex;flex-direction:column;gap:7px}
.summ .srow{display:flex;align-items:center;gap:9px;font-size:13.5px}
.summ .si{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800}
.summ .si.ok{background:#e6f4ea;color:#1a7f37}
.summ .si.miss{background:#fcefc7;color:#9a6700}
.portal-link{font-size:12.5px;background:var(--line-2);border-radius:9px;padding:9px 11px;margin-top:12px;word-break:break-all}
/* ---- Datei-Upload ---- */
.uprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer;transition:.12s}
.upbtn:hover{border-color:var(--green);color:var(--green-2)}
.upbtn.busy{opacity:.6;pointer-events:none}
.upbtn input{display:none}
.uphint{font-size:12px;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumb{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--line-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.wide{width:150px}
.thumb .thx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:6px;border:none;background:rgba(15,25,20,.72);color:#fff;font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center}
.thumb .thx:hover{background:var(--danger)}

/* ---------- BILD-ZUSCHNEIDER (Cropper) ---------- */
.crop-bg{position:fixed;inset:0;background:rgba(11,26,18,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:80}
.crop-card{background:#fff;border-radius:18px;width:100%;max-width:540px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;animation:pop .15s ease}
.crop-h{padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.crop-h h3{font-size:17px;font-weight:800;letter-spacing:-.2px}
.crop-h p{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.crop-body{padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:15px}
.crop-stage{position:relative;border-radius:12px;overflow:hidden;background:#0e1512;touch-action:none;cursor:grab;user-select:none}
.crop-stage.dragging{cursor:grabbing}
.crop-stage.nodrag{cursor:default}
.crop-stage canvas{display:block}
.crop-ovl{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.crop-ovl::before,.crop-ovl::after{content:"";position:absolute;background:rgba(255,255,255,.28)}
.crop-ovl::before{left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.28);border-right:1px solid rgba(255,255,255,.28);background:none}
.crop-ovl::after{top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);background:none}
.crop-stage.round .crop-ovl{border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),inset 0 0 0 999px rgba(14,21,18,.5)}
.crop-stage.round .crop-ovl::before,.crop-stage.round .crop-ovl::after{display:none}
.crop-zoom{display:flex;align-items:center;gap:11px;width:100%}
.crop-zoom .zi{font-size:15px;color:var(--muted);width:16px;text-align:center;flex:none}
.crop-zoom input[type=range]{flex:1;accent-color:var(--green);height:4px}
.crop-foot{display:flex;gap:10px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--line-2)}
.crop-dim{font-size:11.5px;color:var(--muted);font-weight:600;margin-right:auto}
@media(max-width:860px){.bgrid{grid-template-columns:1fr}}
@media(max-width:720px){.wsteps{grid-template-columns:repeat(2,1fr)}}

/* CSV preview */
.csvtable{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:240px}
.csvtable table{font-size:13px}
.csvtable th,.csvtable td{padding:8px 10px;white-space:nowrap}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.maprow .col{font-size:13px;font-weight:600;background:var(--line-2);padding:7px 10px;border-radius:8px;min-width:0}
.maprow.off{opacity:.5}
.maprow select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.maprow.ask{background:#fff8e6;border:1px solid #f3d27a;border-radius:10px;padding:8px;margin-left:-8px;margin-right:-8px}
.mapbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-top:4px}
.mapbadge.ok{background:#e6f4ea;color:#1a7f37}
.mapbadge.ask{background:#fcefc7;color:#9a6700}
.extragrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.extra-k{color:var(--muted);font-weight:600}
.extra-v{color:var(--text);word-break:break-word}
.mmrow{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mmrow:hover{background:rgba(0,0,0,.02)}
.mmrow input[type=checkbox]{margin-top:3px;width:16px;height:16px;flex:none;cursor:pointer}
@media(max-width:820px){.mm-grid{grid-template-columns:1fr!important}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-2);color:#fff;padding:12px 18px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:80;animation:pop .15s ease}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 50px rgba(0,0,0,.4)}
  .sidebar.open{transform:translateX(0)}
  .menubtn{display:grid!important}
  .stats{grid-template-columns:repeat(2,1fr)}
  .content{padding:18px 16px 60px}
  .topbar{padding:14px 16px}
  .frow2{grid-template-columns:1fr}
  .hide-sm{display:none}
}
.menubtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;place-items:center;font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}

/* ---------- DETAIL / COCKPIT ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;cursor:pointer}
.backlink:hover{color:var(--green-2)}
.dhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.dhead .av{width:54px;height:54px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0}
.dhead h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.dhead .meta{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cardh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cardh b{font-size:15px}
.cardh .btn{margin-left:auto}
.cardp{padding:16px 18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;font-size:14px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{color:var(--text);word-break:break-word}
.modgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
.modrow .mt{flex:1;min-width:0}
.modrow .mt b{font-size:14px;display:block}
.modrow .mt small{color:var(--muted);font-size:11.5px}
.switch{position:relative;width:40px;height:23px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd8d0;border-radius:999px;transition:.18s;cursor:pointer}
.slider:before{content:'';position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(17px)}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.listrow:last-child{border-bottom:none}
.listrow .lt{flex:1;min-width:0}
.listrow .lt b{font-size:14px}

/* ---- Bewerber-Zuordnung (Many-to-Many) Helfer ----
   Quelle der Wahrheit = state.zuordnungen (Join-Tabelle bewerber_zuordnung).
   Fallback auf legacy bewerber.customer_id, solange v8 nicht gelaufen ist
   ODER fuer Website-Bewerbungen (apply_to_job setzt nur customer_id). */
function asgRows(bid){            // alle Zuordnungs-Zeilen eines Bewerbers
  return state.zuordLoaded ? state.zuordnungen.filter(z=>z.bewerber_id===bid) : [];
}
function bewIsAssigned(b){        // hat der Bewerber mind. eine Zuordnung?
  if(b.customer_id) return true;
  return state.zuordLoaded && state.zuordnungen.some(z=>z.bewerber_id===b.id);
}
function bewCustomerIds(b){       // alle Kunden-IDs eines Bewerbers (legacy + join)
  const s=new Set();
  if(b.customer_id) s.add(b.customer_id);
  if(state.zuordLoaded) state.zuordnungen.forEach(z=>{ if(z.bewerber_id===b.id) s.add(z.customer_id); });
  return [...s];
}
function bewIdsForCustomer(cid){  // alle Bewerber-IDs, die diesem Kunden zugeordnet sind
  const s=new Set();
  state.bewerber.forEach(b=>{ if(b.customer_id===cid) s.add(b.id); });
  if(state.zuordLoaded) state.zuordnungen.forEach(z=>{ if(z.customer_id===cid) s.add(z.bewerber_id); });
  return s;
}
function bewForCustomer(cid){     // Bewerber-Objekte fuer einen Kunden
  const ids=bewIdsForCustomer(cid);
  return state.bewerber.filter(b=>ids.has(b.id));
}
function bewCountForStelle(sid){  // Anzahl Bewerber auf einer Stelle (legacy + join)
  const s=new Set();
  state.bewerber.forEach(b=>{ if(b.stellenanzeige_id===sid) s.add(b.id); });
  if(state.zuordLoaded) state.zuordnungen.forEach(z=>{ if(z.stellenanzeige_id===sid) s.add(z.bewerber_id); });
  return s.size;
}

/* Edge Function für User-Provisioning (service_role bleibt server-seitig) */
async function callAdmin(action,payload={}){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw new Error('Keine Session');
  const res=await fetch(SUPABASE_URL+'/functions/v1/admin-users',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON},
    body:JSON.stringify(Object.assign({action},payload))
  });
  let j={}; try{j=await res.json();}catch(e){}
  if(!res.ok||j.error) throw new Error(j.error||('HTTP '+res.status));
  return j;
}

/* ===================== AUTH ===================== */
let RECOVERY=false;
async function init(){
  // Recovery-Flow: Supabase haengt #access_token=...&type=recovery an die URL
  if(location.hash.includes('type=recovery')){
    RECOVERY=true;
    showLogin(); showRecover();
    history.replaceState(null,'',location.pathname+location.search);
    return;
  }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY'){ RECOVERY=true; showLogin(); showRecover(); } });
  const {data:{session}} = await sb.auth.getSession();
  if(session && !RECOVERY) await afterLogin(); else showLogin();
}
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }

/* ---- Login / Forgot / Recover Umschalter ---- */
function showLoginForm(){
  $('#loginForm').classList.remove('hidden');
  $('#forgotForm').classList.add('hidden'); $('#recoverForm').classList.add('hidden');
}
function showForgot(){
  $('#loginForm').classList.add('hidden'); $('#recoverForm').classList.add('hidden');
  $('#forgotForm').classList.remove('hidden');
  $('#fg-email').value = $('#li-email').value.trim();
  $('#fg-msg').className='loginmsg'; $('#fg-msg').textContent='';
}
function showRecover(){
  $('#loginForm').classList.add('hidden'); $('#forgotForm').classList.add('hidden');
  $('#recoverForm').classList.remove('hidden');
}

async function doForgot(e){
  e.preventDefault();
  const msg=$('#fg-msg'), btn=$('#fg-btn');
  const email=$('#fg-email').value.trim();
  msg.className='loginmsg'; msg.textContent=''; btn.disabled=true; btn.textContent='Sende...';
  const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  btn.disabled=false; btn.textContent='Link zum Zurücksetzen senden';
  if(error){ msg.className='loginmsg err'; msg.textContent='Fehler: '+error.message; return; }
  msg.className='loginmsg ok';
  msg.textContent='Falls ein Konto mit dieser E-Mail existiert, ist ein Link zum Zurücksetzen unterwegs. Bitte Postfach (und Spam) prüfen.';
}

async function doRecover(e){
  e.preventDefault();
  const msg=$('#rc-msg'), btn=$('#rc-btn');
  const pw=$('#rc-pw').value, pw2=$('#rc-pw2').value;
  msg.className='loginmsg'; msg.textContent='';
  if(pw.length<8){ msg.className='loginmsg err'; msg.textContent='Passwort muss mindestens 8 Zeichen haben.'; return; }
  if(pw!==pw2){ msg.className='loginmsg err'; msg.textContent='Die beiden Passwörter stimmen nicht überein.'; return; }
  btn.disabled=true; btn.textContent='Speichere...';
  const {error} = await sb.auth.updateUser({password:pw});
  btn.disabled=false; btn.textContent='Neues Passwort speichern';
  if(error){ msg.className='loginmsg err'; msg.textContent='Fehler: '+error.message; return; }
  RECOVERY=false;
  msg.className='loginmsg ok'; msg.textContent='Passwort gespeichert. Du wirst angemeldet...';
  await afterLogin();
}

async function doLogin(e){
  e.preventDefault();
  const msg=$('#li-msg'); const btn=$('#li-btn');
  msg.className='loginmsg'; msg.textContent=''; btn.disabled=true; btn.textContent='Prüfe...';
  const email=$('#li-email').value.trim(); const pw=$('#li-pw').value;
  const {error} = await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false; btn.textContent='Anmelden';
  if(error){ msg.className='loginmsg err'; msg.textContent='Login fehlgeschlagen: '+error.message; return; }
  await afterLogin();
}

async function afterLogin(){
  const {data:{user}} = await sb.auth.getUser();
  const {data:prof,error} = await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error || !prof){ await sb.auth.signOut(); $('#li-msg').className='loginmsg err'; $('#li-msg').textContent='Kein Profil gefunden.'; showLogin(); return; }
  if(prof.role!=='gc_admin'){
    await sb.auth.signOut(); showLogin();
    $('#li-msg').className='loginmsg err';
    $('#li-msg').textContent='Dieser Login ist nur für GreenCareers-Mitarbeiter (gc_admin).';
    return;
  }
  state.profile=prof;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').innerHTML='<b>'+esc(prof.name||prof.email)+'</b><small>GC-Admin · Vollzugriff</small>';
  $('#content').innerHTML='<div class="empty"><div class="big">\u25CC</div><b>Daten werden geladen\u2026</b></div>';
  await loadAll();
  setView('dashboard');
}
async function doLogout(){ await sb.auth.signOut(); state.profile=null; showLogin(); showLoginForm(); $('#li-pw').value=''; }

/* ===================== DATA ===================== */
async function loadAll(){
  const [c,s,b,br,tk,ac,pr] = await Promise.all([
    sb.from('customers').select('*').order('name'),
    sb.from('stellenanzeigen').select('*').order('created_at',{ascending:false}),
    sb.from('bewerber').select('*').order('created_at',{ascending:false}),
    sb.from('branchen').select('*').order('sort'),
    sb.from('support_tickets').select('*').order('created_at',{ascending:false}),
    sb.from('activity_log').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('created_at',{ascending:false})
  ]);
  state.customers = c.data||[]; state.stellen = s.data||[];
  state.bewerber = b.data||[]; state.branchen = br.data||[];
  state.tickets = tk.data||[]; state.activity = ac.data||[]; state.users = pr.data||[];
  // Join-Tabelle defensiv laden: falls v8 noch nicht gelaufen ist (Tabelle fehlt),
  // bleibt zuordLoaded=false und alles faellt sauber auf legacy customer_id zurueck.
  const z=await sb.from('bewerber_zuordnung').select('*');
  if(z.error){ state.zuordnungen=[]; state.zuordLoaded=false; }
  else { state.zuordnungen=z.data||[]; state.zuordLoaded=true; }
}
async function reload(table){
  if(table==='customers'){const {data}=await sb.from('customers').select('*').order('name');state.customers=data||[];}
  if(table==='stellen'){const {data}=await sb.from('stellenanzeigen').select('*').order('created_at',{ascending:false});state.stellen=data||[];}
  if(table==='bewerber'){const {data}=await sb.from('bewerber').select('*').order('created_at',{ascending:false});state.bewerber=data||[];}
  if(table==='zuordnungen'){const z=await sb.from('bewerber_zuordnung').select('*');if(!z.error){state.zuordnungen=z.data||[];state.zuordLoaded=true;}}
  if(table==='tickets'){const {data}=await sb.from('support_tickets').select('*').order('created_at',{ascending:false});state.tickets=data||[];}
  if(table==='activity'){const {data}=await sb.from('activity_log').select('*').order('created_at',{ascending:false});state.activity=data||[];}
  if(table==='users'){const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});state.users=data||[];}
}

function selField(id,field,arr,cur){

    arr.map(p=>'<option value="'+esc(p.v)+'"'+(p.v===cur?' selected':'')+'>'+esc(p.l)+'</option>').join('')+'</select>';

async function saveCustomerField(id,field,val){
  if(field==='mrr') val=Number(val)||0;
  if(field==='betrag') val=(val===''||val==null)?null:(Number(val)||0);
  if(field==='vertrag_start' && !val) val=null;
  if(['kauftyp','produkt','laufzeit','zahlungsart'].includes(field) && val==='') val=null;
  const res=await sb.from('customers').update({[field]:val}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  // Kauftyp aendert die Sichtbarkeit von Laufzeit -> Cockpit neu rendern
  await reload('customers'); render(); toast('Gespeichert');
}
async function toggleModule(id,mod,on){
  const c=cust(id); const mods=Object.assign(defaultModules(),c.modules||{}); mods[mod]=on;
  const res=await sb.from('customers').update({modules:mods}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('customers'); toast((on?'Freigeschaltet: ':'Gesperrt: ')+mod);
}
function loginAsCustomer(id){
  const c=cust(id);
  toast('Kunden-OS wird ge\u00f6ffnet'+(c?' \u2013 '+c.name:''));
  window.open('https://os.green-careers.de/','_blank','noopener');
}

      '<div class="frow"><label>E-Mail (Login) *</label><input id="u-email" type="email" value="'+esc(c?c.email||'':'')+'"></div>'+
      '<div class="frow2"><div class="frow"><label>Rolle</label><select id="u-role" onchange="$(\'#u-custwrap\').style.display=this.value===\'gc_admin\'?\'none\':\'block\'"><option value="owner">Inhaber (Kunde)</option><option value="gc_admin">GreenCareers-Admin</option></select></div>'+
      '<div class="frow" id="u-custwrap"><label>Kunde</label><select id="u-cust">'+custOpts+'</select></div></div>'+
      '<div class="frow"><label>Start-Passwort *</label><input id="u-pw" value="'+esc(pw)+'"></div>'+
      '<div class="pwbox">Notiere das Passwort \u2013 der Kunde kann es nach dem ersten Login ändern. Vorschlag: <code>'+esc(pw)+'</code></div>',
    footer:'<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn" id="u-go" onclick="createLogin()">Anlegen</button>'
  });
}
async function createLogin(){
  const email=$('#u-email').value.trim(); const pw=$('#u-pw').value; const name=$('#u-name').value.trim(); const role=$('#u-role').value;
  const cid=role==='gc_admin'?null:($('#u-cust').value||null);
  if(!email||pw.length<8){toast('E-Mail + Passwort (min. 8 Zeichen)');return;}
  const btn=$('#u-go'); btn.disabled=true; btn.textContent='Lege an...';
  try{
    await callAdmin('create',{email,password:pw,name,role,customer_id:cid});
    await reload('users'); closeModal(); render(); toast('Login angelegt: '+email);
  }catch(e){ btn.disabled=false; btn.textContent='Anlegen'; toast('Fehler: '+e.message); }
}
async function resetLogin(uid){
  const u=state.users.find(x=>x.id===uid); const pw=genPw();
  openModal({title:'Passwort setzen',
    body:'<div class="frow"><label>Neues Passwort für '+esc(u?u.email:'')+'</label><input id="rp-pw" value="'+esc(pw)+'"></div><div class="pwbox">Neuer Vorschlag: <code>'+esc(pw)+'</code></div>',
    footer:'<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Abbrechen</button><button class="btn" id="rp-go" onclick="doResetLogin(\''+uid+'\')">Setzen</button>'});
}
async function doResetLogin(uid){
  const pw=$('#rp-pw').value; if(pw.length<8){toast('Min. 8 Zeichen');return;}
  const btn=$('#rp-go'); btn.disabled=true; btn.textContent='...';
  try{ await callAdmin('set_password',{id:uid,password:pw}); closeModal(); toast('Passwort gesetzt'); }
  catch(e){ btn.disabled=false; btn.textContent='Setzen'; toast('Fehler: '+e.message); }
}
async function deleteLogin(uid){
  if(!confirm('Login wirklich entfernen?'))return;
  try{ await callAdmin('delete',{id:uid}); await reload('users'); render(); toast('Login entfernt'); }
  catch(e){ toast('Fehler: '+e.message); }
}

const MEDIA_BUCKET='portal-media';
let CUP={}, WMP={};   // CUP=Kunden-Bilder, WMP=Stellen-Bilder (Form-Zwischenstand)
async function uploadMedia(file, folder){
  const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg');
  const base=(folder||'misc').replace(/[^a-z0-9_\/-]/gi,'-');
  const path=base+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
  const {error}=await sb.storage.from(MEDIA_BUCKET).upload(path,file,{upsert:true,cacheControl:'3600',contentType:file.type||undefined});
  if(error) throw error;
  return sb.storage.from(MEDIA_BUCKET).getPublicUrl(path).data.publicUrl;
}

/* ===================== BILD-ZUSCHNEIDER (in-browser, WYSIWYG) ===================== */
/* Idiotensicher: Kunde lädt ein Bild in beliebigem Format hoch und zieht/zoomt den
   Ausschnitt selbst zurecht. Was im Rahmen zu sehen ist, wird exakt so gespeichert –
   immer im richtigen Pixelformat. Logos werden komplett gezeigt (nie abgeschnitten). */
const CROP_PRESETS = {
  // crop = Rahmen wird gefüllt (cover), Ausschnitt wählbar
  titel: {mode:'crop', W:1600, H:600,  bg:'#0e1512', fmt:'image/jpeg', q:.9,
          title:'Titelbild zuschneiden', hint:'Zieh den Ausschnitt zurecht und zoome mit dem Regler. Format 1600 × 600 px (8:3) \u2013 Motiv mittig halten.'},
  cover: {mode:'crop', W:1280, H:720,  bg:'#0e1512', fmt:'image/jpeg', q:.9,
          title:'Bild zuschneiden', hint:'Zieh den Ausschnitt zurecht und zoome mit dem Regler. Format 1280 × 720 px (16:9).'},
  foto:  {mode:'crop', W:600,  H:600,  bg:'#0e1512', fmt:'image/jpeg', q:.9, round:true,
          title:'Foto zuschneiden', hint:'Gesicht mittig setzen \u2013 wird rund angezeigt. Format 600 × 600 px.'},
  // fit = ganzes Bild bleibt sichtbar (contain), nur Rand/Größe einstellbar
  logo:  {mode:'fit',  W:512,  H:512,  bg:'#ffffff', fmt:'image/png',  q:1,
          title:'Logo anpassen', hint:'Dein komplettes Logo bleibt immer sichtbar. Mit dem Regler den Rand (Weißraum) einstellen. Format 512 × 512 px.'},
};
function openCropper(file, presetKey){
  return new Promise((resolve, reject)=>{
    const P = CROP_PRESETS[presetKey] || CROP_PRESETS.cover;
    if(!/^image\//.test(file.type)){ toast('Bitte eine Bilddatei wählen'); return reject('type'); }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=> buildCropper(file, img, url, P, resolve, reject);
    img.onerror = ()=>{ URL.revokeObjectURL(url); toast('Bild konnte nicht geladen werden'); reject('load'); };
    img.src = url;
  });
}
function buildCropper(file, img, url, P, resolve, reject){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const aspect = P.W/P.H;
  let dispW = 460, dispH = dispW/aspect;
  const maxH = 360;
  if(dispH > maxH){ dispH = maxH; dispW = dispH*aspect; }
  dispW = Math.round(dispW); dispH = Math.round(dispH);
  const root = $('#cropRoot');
  root.innerHTML =
    '<div class="crop-bg"><div class="crop-card">'+
      '<div class="crop-h"><h3>'+esc(P.title)+'</h3><p>'+esc(P.hint)+'</p></div>'+
      '<div class="crop-body">'+
        '<div class="crop-stage'+(P.round?' round':'')+(P.mode==='fit'?' nodrag':'')+'" id="cropStage" style="width:'+dispW+'px;height:'+dispH+'px">'+
          '<canvas id="cropCanvas"></canvas><div class="crop-ovl"></div>'+
        '</div>'+
        '<div class="crop-zoom"><span class="zi">\u2212</span><input type="range" id="cropZoom" min="0" max="100" value="0"><span class="zi">+</span></div>'+
      '</div>'+
      '<div class="crop-foot"><span class="crop-dim">Export: '+P.W+' \u00d7 '+P.H+' px</span>'+
        '<button class="btn ghost" id="cropCancel">Abbrechen</button>'+
        '<button class="btn" id="cropSave">Übernehmen</button></div>'+
    '</div></div>';

  const stage = $('#cropStage'), canvas = $('#cropCanvas'), ctx = canvas.getContext('2d');
  canvas.width = Math.round(dispW*dpr); canvas.height = Math.round(dispH*dpr);
  canvas.style.width = dispW+'px'; canvas.style.height = dispH+'px';
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const base = P.mode==='crop' ? Math.max(dispW/iw, dispH/ih) : Math.min(dispW/iw, dispH/ih);
  // Zoombereich: crop = 1..3 (kann nicht unter Vollabdeckung), fit = 0.5..1 (nie über Vollbild = nie abgeschnitten)
  const zMin = P.mode==='crop' ? 1 : 0.5, zMax = P.mode==='crop' ? 3 : 1;
  let zoom = P.mode==='crop' ? 1 : 1, pan = {x:0,y:0};

  function clampPan(){
    if(P.mode!=='crop'){ pan.x=0; pan.y=0; return; }
    const dw = iw*base*zoom, dh = ih*base*zoom;
    const mx = Math.max(0,(dw-dispW)/2), my = Math.max(0,(dh-dispH)/2);
    pan.x = Math.max(-mx, Math.min(mx, pan.x));
    pan.y = Math.max(-my, Math.min(my, pan.y));
  }
  function draw(){
    clampPan();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,dispW,dispH);
    ctx.fillStyle = P.bg; ctx.fillRect(0,0,dispW,dispH);
    const dw = iw*base*zoom, dh = ih*base*zoom;
    const dx = (dispW-dw)/2 + pan.x, dy = (dispH-dh)/2 + pan.y;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, dx, dy, dw, dh);
  }
  function setZoomFromSlider(v){ zoom = zMin + (zMax-zMin)*(v/100); draw(); }
  const zEl = $('#cropZoom');
  zEl.value = ((zoom-zMin)/(zMax-zMin))*100;
  zEl.addEventListener('input', ()=> setZoomFromSlider(+zEl.value));

  // Pan per Maus/Touch (nur crop-Modus)
  let drag=null;
  if(P.mode==='crop'){
    stage.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y}; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', e=>{ if(!drag) return; pan.x=drag.px+(e.clientX-drag.x); pan.y=drag.py+(e.clientY-drag.y); draw(); });
    const end=()=>{ drag=null; stage.classList.remove('dragging'); };
    stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
    stage.addEventListener('wheel', e=>{ e.preventDefault(); const step=e.deltaY<0?2:-2; zEl.value=Math.max(0,Math.min(100,+zEl.value+step)); setZoomFromSlider(+zEl.value); }, {passive:false});
  }

  function cleanup(){ URL.revokeObjectURL(url); root.innerHTML=''; }
  $('#cropCancel').addEventListener('click', ()=>{ cleanup(); reject('cancel'); });
  $('#cropSave').addEventListener('click', ()=>{
    const out = document.createElement('canvas'); out.width=P.W; out.height=P.H;
    const o = out.getContext('2d'); o.imageSmoothingQuality='high';
    o.fillStyle = P.bg; o.fillRect(0,0,P.W,P.H);
    const k = P.W/dispW;                    // Display -> Export (gleiches Seitenverhältnis)
    const dw = iw*base*zoom, dh = ih*base*zoom;
    const dx = (dispW-dw)/2 + pan.x, dy = (dispH-dh)/2 + pan.y;
    o.drawImage(img, dx*k, dy*k, dw*k, dh*k);
    out.toBlob(b=>{
      if(!b){ toast('Zuschnitt fehlgeschlagen'); return; }
      const ext = P.fmt==='image/png' ? 'png' : 'jpg';
      const nm = (file.name.replace(/\.[^.]+$/,'') || 'bild').replace(/[^\w-]+/g,'-').slice(0,40);
      cleanup();
      resolve(new File([b], nm+'.'+ext, {type:P.fmt}));
    }, P.fmt, P.q);
  });
  draw();
}
/* Upload mit vorgeschaltetem Zuschnitt – einzeln */
async function pickCropSingle(input, obj, key, folder, rerenderFn, presetKey){
  const f = input.files && input.files[0]; if(!f) return;
  const btn = input.closest('.upbtn'); input.value='';
  let file; try{ file = await openCropper(f, presetKey); }catch(e){ return; }
  if(btn) btn.classList.add('busy');
  try{ obj[key] = await uploadMedia(file, folder); rerenderFn(); }
  catch(e){ toast('Upload fehlgeschlagen: '+(e.message||e)); }
  finally{ if(btn) btn.classList.remove('busy'); }
}
/* Upload mit vorgeschaltetem Zuschnitt – mehrere (nacheinander) */
async function pickCropMulti(input, arr, folder, rerenderFn, presetKey){
  const files = [...(input.files||[])]; if(!files.length) return;
  const btn = input.closest('.upbtn'); input.value='';
  for(const raw of files){
    let file; try{ file = await openCropper(raw, presetKey); }catch(e){ continue; } // Abbrechen = dieses Bild überspringen
    if(btn) btn.classList.add('busy');
    try{ arr.push(await uploadMedia(file, folder)); rerenderFn(); }
    catch(e){ toast('Upload fehlgeschlagen: '+(e.message||e)); }
    finally{ if(btn) btn.classList.remove('busy'); }
  }
}

/* PLZ -> Ort automatisch befüllen (nur wenn Ort leer; bleibt editierbar) */
async function plzAutofill(){
  const plzEl=$('#c-plz'), ortEl=$('#c-ort');
  if(!plzEl||!ortEl) return;
  const plz=plzEl.value.trim();
  if(!/^\d{5}$/.test(plz) || ortEl.value.trim()) return;
  try{
    const r=await fetch('https://api.zippopotam.us/de/'+plz);
    if(!r.ok) return;
    const d=await r.json();
    const place=d&&d.places&&d.places[0]&&d.places[0]['place name'];
    if(place && !ortEl.value.trim()) ortEl.value=place;
  }catch(e){/* offline o.ae. -> stiller Fallback, Feld bleibt manuell */}
}

function wizCustChange(){
  const c=cust($('#s-cust').value); if(!c) return;
  if(!$('#s-ap').value) $('#s-ap').value=c.ansprechpartner||'';
  if(!$('#s-kmail').value) $('#s-kmail').value=c.email||'';
  if(!$('#s-ktel').value) $('#s-ktel').value=c.telefon||'';
}
function wizGo(n){
  n=Math.max(0,Math.min(WIZ.last,n)); WIZ.step=n; WIZ.visited[n]=true;
  document.querySelectorAll('.wpane').forEach(p=>p.classList.toggle('on',+p.dataset.step===n));
  document.querySelectorAll('.wstep').forEach((p,i)=>{p.classList.toggle('on',i===n);p.classList.toggle('done',i!==n&&WIZ.visited[i]&&wizStepDone(i));});
  $('#wiz-back').style.display = n===0?'none':'';
  $('#wiz-next').style.display = n===WIZ.last?'none':'';
  $('#wiz-save').style.display = n===WIZ.last?'':'none';
  $('#wizErr').classList.remove('on');
  if(n===WIZ.last) wizRenderSumm();
  const mb=document.querySelector('.modal-b'); if(mb) mb.scrollTop=0;
}
function wizStepDone(i){
  if(i===0) return !!($('#s-titel')&&$('#s-titel').value.trim());
  if(i===1) return !!($('#s-besch')&&$('#s-besch').value.trim());
  return true; // 2,3,4 optional
}
function wizErr(msg){const e=$('#wizErr');e.innerHTML=msg;e.classList.add('on');const mb=document.querySelector('.modal-b');if(mb)mb.scrollTop=0;}
function wizNext(){
  if(WIZ.step===0 && !$('#s-titel').value.trim()){return wizErr('Bitte gib einen <b>Stellentitel</b> ein \u2013 z.B. \u201eTiefbaufacharbeiter (m/w/d)\u201c.');}
  if(WIZ.step===1 && !$('#s-besch').value.trim()){return wizErr('Bitte beschreibe die Stelle kurz unter <b>Kurzbeschreibung</b> \u2013 das sieht der Bewerber zuerst.');}
  wizGo(WIZ.step+1);
}
function chipBlock(key,label,ph,hint){
  return '<div class="frow"><label>'+label+'</label>'+
    '<div class="chipin"><input id="chip-'+key+'" placeholder="'+ph+'" onkeydown="chipKey(event,\''+key+'\')"><button type="button" class="chipadd" onclick="chipAdd(\''+key+'\')">+ Hinzufügen</button></div>'+
    '<div class="chiplist" id="chips-'+key+'"></div>'+
    '<div class="hint">'+hint+'</div></div>';
}
function chipAdd(key){
  const inp=document.getElementById('chip-'+key); if(!inp) return;
  const v=inp.value.trim(); if(!v) return;
  WIZ[key]=WIZ[key]||[];
  if(WIZ[key].some(x=>x.toLowerCase()===v.toLowerCase())){ inp.value=''; return; }
  WIZ[key].push(v); inp.value=''; inp.focus(); chipRender(key,true);
}
function chipKey(e,key){ if(e.key==='Enter'){ e.preventDefault(); chipAdd(key); } }
function chipDel(key,i){ (WIZ[key]||[]).splice(i,1); chipRender(key); }
function chipRender(key,anim){
  const box=document.getElementById('chips-'+key); if(!box) return;
  const arr=WIZ[key]||[];
  box.innerHTML=arr.map((t,i)=>'<span class="chip"><span class="cx">\u2713</span><span class="ct">'+esc(t)+'</span><button type="button" class="crm" title="Entfernen" onclick="chipDel(\''+key+'\','+i+')">\u00d7</button></span>').join('');
  if(anim){ const last=box.lastElementChild; if(last) last.classList.add('pop'); }
}
function pickTitel(){ const sel=document.getElementById('s-titel-sel'); const inp=document.getElementById('s-titel'); if(sel&&sel.value&&inp){ inp.value=sel.value; inp.focus(); } }
function wizCollectBenefits(){
  const sel=[...document.querySelectorAll('#benGrid .bopt.on span:last-child')].map(s=>s.textContent.trim());
  return [...sel,...(WIZ.benCustom||[])];
}
function wizRenderSumm(){
  const row=(ok,label,hint)=>'<div class="srow"><span class="si '+(ok?'ok':'miss')+'">'+(ok?'\u2713':'!')+'</span><span>'+label+(ok?'':' <span class="muted">\u2013 '+hint+'</span>')+'</span></div>';
  const benN=wizCollectBenefits().length;
  const aufgN=(WIZ.aufgaben||[]).length, profN=(WIZ.profil||[]).length;
  const bilderN=(WMP.stellen_bilder||[]).length;
  $('#wizSumm').innerHTML=
    row(!!$('#s-titel').value.trim(),'Stellentitel','Pflicht (Schritt 1)')+
    row(!!$('#s-besch').value.trim(),'Kurzbeschreibung','Pflicht (Schritt 2)')+
    row(aufgN>0,aufgN+' Aufgaben','empfohlen (Schritt 2)')+
    row(profN>0,profN+' Anforderungen','empfohlen (Schritt 2)')+
    row(benN>0,benN+' Benefits ausgewählt','empfohlen (Schritt 3)')+
    row(!!$('#s-ap').value.trim(),'Ansprechpartner','empfohlen (Schritt 4)')+
    row(bilderN>0,bilderN+' Stellen-Bilder','optional');
}
function slugify(t){
  return (t||'stelle').toLowerCase()
    .replace(/[\u00e4]/g,'ae').replace(/[\u00f6]/g,'oe').replace(/[\u00fc]/g,'ue').replace(/[\u00df]/g,'ss')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48)
    +'-'+Math.random().toString(36).slice(2,8);
}
async function saveStelle(id){
  const titel=$('#s-titel').value.trim();
  if(!titel){wizGo(0);return wizErr('Bitte gib einen <b>Stellentitel</b> ein (Schritt 1).');}
  if(!$('#s-besch').value.trim()){wizGo(1);return wizErr('Bitte fülle die <b>Kurzbeschreibung</b> aus (Schritt 2).');}
  const status=$('#s-status').value;
  const benefitsList=wizCollectBenefits();
  const stellenBilder=(WMP.stellen_bilder||[]).filter(Boolean);
  const payload={titel,customer_id:$('#s-cust').value,branche:$('#s-branche').value.trim(),
    ort:$('#s-ort').value.trim(),status,beschreibung:$('#s-besch').value.trim(),
    beschaeftigungsart:$('#s-art').value,vertragsart:$('#s-vt').value,
    gehalt:$('#s-gehalt').value.trim(),eintritt:$('#s-eintritt').value.trim(),
    aufgaben:(WIZ.aufgaben||[]).join('\n'),profil:(WIZ.profil||[]).join('\n'),
    benefits:benefitsList.join('\n'),benefits_list:benefitsList,stellen_bilder:stellenBilder,
    ansprechpartner:$('#s-ap').value.trim(),ansprechpartner_rolle:$('#s-aprolle').value.trim(),
    ansprechpartner_foto:WMP.ansprechpartner_foto||null,
    kontakt_email:$('#s-kmail').value.trim(),kontakt_telefon:$('#s-ktel').value.trim()};
  if(status==='aktiv') payload.published_at=new Date().toISOString();
  const btn=$('#wiz-save'); if(btn){btn.disabled=true;btn.textContent='Speichern \u2026';}
  let res;
  if(id){
    res=await sb.from('stellenanzeigen').update(payload).eq('id',id);
  }else{
    payload.slug=slugify(titel);
    res=await sb.from('stellenanzeigen').insert(payload);
  }
  if(res.error){if(btn){btn.disabled=false;btn.textContent=id?'Speichern':'Stelle anlegen';}return wizErr('Fehler beim Speichern: '+esc(res.error.message));}
  await reload('stellen'); closeModal(); render(); toast(id?'Stelle gespeichert':'Stelle angelegt');
}
async function deleteStelle(id){
  if(!confirm('Stelle löschen?'))return;
  const res=await sb.from('stellenanzeigen').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('stellen'); closeModal(); render(); toast('Stelle gelöscht');
}

    '<button class="'+(state.bewView==='pipeline'?'on':'')+'" onclick="state.bewView=\'pipeline\';render()">Pipeline</button></div></div>';
  if(state.bewView==='pipeline'){
    $('#content').innerHTML=seg+renderBoard(rows);
    return;
  }
  $('#content').innerHTML=seg+'<div class="card tablecard">'+tableBewerber(rows,true,true)+'</div>';
}
function renderBoard(rows){
  return '<div class="board">'+STATUS.map(col=>{
    const items=rows.filter(b=>b.status===col.id);
    return '<div class="kcol" data-status="'+col.id+'" ondragover="kDragOver(event)" ondragleave="kDragLeave(event)" ondrop="kDrop(event,\''+col.id+'\')">'+
      '<div class="kcolh"><span class="tag-s '+col.c+'" style="font-size:11px">'+esc(col.label)+'</span><span class="n">'+items.length+'</span></div>'+
      '<div class="kbody">'+items.map(b=>
        '<div class="kcard" draggable="true" ondragstart="kDragStart(event,\''+b.id+'\')" onclick="editBewerber(\''+b.id+'\')">'+
        '<b>'+esc(b.name)+'</b>'+
        '<div class="sub">'+custCellTxt(b)+'</div>'+
        '<div class="kf"><span class="miniquelle">'+esc(b.quelle||'manuell')+'</span>'+(b.rating?'<span class="stars">'+'\u2605'.repeat(b.rating)+'</span>':'')+'</div>'+
        '</div>'
      ).join('')+'</div></div>';
  }).join('')+'</div>';
}
let DRAG_ID=null;
function kDragStart(e,id){ DRAG_ID=id; e.dataTransfer.effectAllowed='move'; }
function kDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag'); }
function kDragLeave(e){ e.currentTarget.classList.remove('drag'); }
async function kDrop(e,status){
  e.preventDefault(); e.currentTarget.classList.remove('drag');
  if(!DRAG_ID)return; const id=DRAG_ID; DRAG_ID=null;
  const b=state.bewerber.find(x=>x.id===id); if(!b||b.status===status)return;
  b.status=status; render();
  const res=await sb.from('bewerber').update({status}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);await reload('bewerber');render();return;}
  await reload('bewerber'); toast('Status: '+statusOf(status).label);
}
function tableBewerber(rows, showCust, clickable){
  if(!rows.length) return empty('\u263A','Keine Bewerber','Pflege Bewerber ein oder importiere eine CSV.');
  return '<table><thead><tr><th>Name</th><th class="hide-sm">Kontakt</th>'+(showCust?'<th>Kunde</th>':'')+'<th>Quelle</th><th>Status</th></tr></thead><tbody>'+
    rows.map(b=>{
      const st=statusOf(b.status);
      const click = clickable!==false? 'onclick="editBewerber(\''+b.id+'\')"':'';
      return '<tr '+click+'><td><b>'+esc(b.name)+'</b></td>'+
        '<td class="hide-sm muted">'+esc(b.email||'')+(b.telefon?'<br>'+esc(b.telefon):'')+'</td>'+
        (showCust?'<td>'+custCellTxt(b)+'</td>':'')+
        '<td><span class="tag-s gray">'+esc(b.quelle||'manuell')+'</span></td>'+
        '<td><span class="tag-s '+st.c+'">'+esc(st.label)+'</span></td></tr>';
    }).join('')+'</tbody></table>';
}
let NEWASG=[];  // Pending-Zuordnungen fuer noch nicht gespeicherten Bewerber
let ASG_BULK=false, ASG_BULK_SEL=new Set();  // Bulk-Modus: 1 Bewerber -> viele Betriebe per Klick
function editBewerber(id){
  const b=id? state.bewerber.find(x=>x.id===id):{name:'',email:'',telefon:'',quelle:'manuell',status:'neu',customer_id:'',stellenanzeige_id:'',notizen:''};
  NEWASG=[]; ASG_BULK=false; ASG_BULK_SEL.clear();

  openModal({
    title:id?'Bewerber bearbeiten':'Neuer Bewerber',

      '<div class="frow"><label>Name *</label><input id="b-name" value="'+esc(b.name)+'"></div>'+
      '<div class="frow2"><div class="frow"><label>E-Mail</label><input id="b-email" value="'+esc(b.email||'')+'"></div>'+
      '<div class="frow"><label>Telefon</label><input id="b-tel" value="'+esc(b.telefon||'')+'"></div></div>'+
      '<div class="frow2"><div class="frow"><label>Quelle</label><select id="b-quelle">'+quelleOpts+'</select></div>'+

      '<div class="frow"><label>Betriebe zuordnen <span class="muted" style="font-weight:400">\u2013 Mehrfachzuordnung m\u00f6glich</span></label><div id="asgBox" class="asgbox">'+asgBoxHtml(id)+'</div></div>'+
      '<div class="frow2"><div class="frow"><label>Bewertung</label><div class="stars" id="b-stars">'+[1,2,3,4,5].map(n=>'<span class="star'+((b.rating||0)>=n?' on':'')+'" data-n="'+n+'" onclick="setStar('+n+')">\u2605</span>').join('')+'</div><input type="hidden" id="b-rating" value="'+(b.rating||0)+'"></div>'+
      '<div class="frow"><label>Tags (Komma-getrennt)</label><input id="b-tags" value="'+esc((b.tags||[]).join(', '))+'" placeholder="z.B. Führerschein, Erfahrung"></div></div>'+
      '<div class="frow"><label>Notizen</label><textarea id="b-notiz">'+esc(b.notizen||'')+'</textarea></div>'+
      extraBlock(b.extra),
    footer:(id?'<button class="btn danger sm" onclick="deleteBewerber(\''+id+'\')">Löschen</button>':'')+
      '<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Abbrechen</button>'+
      '<button class="btn" onclick="saveBewerber('+(id?"'"+id+"'":'null')+')">Speichern</button>'
  });
}
/* ---- Multi-Zuordnungs-Manager im Bewerber-Modal ---- */
function asgStelleOpts(cid,sel){
  return '<option value="">\u2014 keine Stelle</option>'+state.stellen.filter(s=>s.customer_id===cid).map(s=>'<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.titel)+'</option>').join('');
}
function asgBoxHtml(id){
  let rows=[];
  if(id){
    asgRows(id).forEach(z=>rows.push({key:z.id,customer_id:z.customer_id,stellenanzeige_id:z.stellenanzeige_id,kind:'join'}));
    const b=state.bewerber.find(x=>x.id===id);
    if(b&&b.customer_id&&!rows.some(r=>r.customer_id===b.customer_id))
      rows.push({key:'legacy',customer_id:b.customer_id,stellenanzeige_id:b.stellenanzeige_id,kind:'legacy'});
  } else {
    NEWASG.forEach((a,i)=>rows.push({key:String(i),customer_id:a.customer_id,stellenanzeige_id:a.stellenanzeige_id,kind:'new'}));
  }
  const taken=rows.map(r=>r.customer_id);
  const list = rows.length ? rows.map(r=>{
    const c=cust(r.customer_id);
    const onCh = r.kind==='join'?'asgStelleJoin(\''+r.key+'\',this.value)':r.kind==='legacy'?'asgStelleLegacy(\''+id+'\',this.value)':'asgStelleNew('+r.key+',this.value)';
    const onRm = r.kind==='join'?'asgRemoveJoin(\''+r.key+'\',\''+id+'\')':r.kind==='legacy'?'asgRemoveLegacy(\''+id+'\')':'asgRemoveNew('+r.key+')';
    return '<div class="asg-row" style="display:flex;gap:8px;align-items:center;margin-bottom:7px">'+
      '<b style="flex:0 0 34%;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c?.name||'?')+'</b>'+
      '<select style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px" onchange="'+onCh+'">'+asgStelleOpts(r.customer_id,r.stellenanzeige_id)+'</select>'+
      '<button type="button" class="btn ghost sm" title="Entfernen" onclick="'+onRm+'">\u2715</button>'+
    '</div>';
  }).join('') : '<div class="muted" style="font-size:13px;margin-bottom:8px">Noch keinem Betrieb zugeordnet.</div>';
  const avail=state.customers.filter(c=>!taken.includes(c.id));
  const idArg=id?"'"+id+"'":'null';
  if(ASG_BULK && avail.length) return list+asgBulkHtml(id,avail);
  const addRow = avail.length ? '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">'+
      '<select id="asg-add-c" style="flex:0 0 44%;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px" onchange="asgAddStelleSync()"><option value="">Betrieb w\u00e4hlen\u2026</option>'+avail.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select>'+
      '<select id="asg-add-s" style="flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px"><option value="">\u2014 Stelle (optional)</option></select>'+
      '<button type="button" class="btn sm" onclick="asgAdd('+idArg+')">+ Zuordnen</button>'+
    '</div>'+
    (avail.length>1?'<div style="margin-top:7px"><button type="button" class="btn ghost sm" onclick="asgBulkToggle('+idArg+')">\u2630 Mehrere auf einmal zuordnen ('+avail.length+')</button></div>':'')
    : (rows.length?'<div class="muted" style="font-size:12.5px;margin-top:4px">Allen Betrieben zugeordnet.</div>':'');
  return list+addRow;
}
/* ---- Bulk-Zuordnung: einen Bewerber mit EINEM Klick vielen Betrieben zuordnen ---- */
function asgBulkHtml(id,avail){
  const idArg=id?"'"+id+"'":'null';
  const rows=avail.map(c=>
    '<label class="asg-bulk-row" data-name="'+esc((c.name||'').toLowerCase())+'" style="display:flex;gap:8px;align-items:center;font-size:13.5px;padding:4px 5px;border-radius:6px;cursor:pointer">'+
      '<input type="checkbox" value="'+c.id+'"'+(ASG_BULK_SEL.has(c.id)?' checked':'')+' onchange="asgBulkPick(\''+c.id+'\',this.checked)"> '+esc(c.name||'?')+
    '</label>').join('');
  return '<div class="asg-bulk" style="margin-top:9px;border:1px solid var(--line);border-radius:10px;padding:11px;background:rgba(0,0,0,.015)">'+
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+
      '<input id="asg-bulk-q" placeholder="Betriebe filtern\u2026" oninput="asgBulkFilter()" style="flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:8px">'+
      '<label style="font-size:12.5px;display:flex;gap:5px;align-items:center;white-space:nowrap;cursor:pointer"><input type="checkbox" id="asg-bulk-all" onchange="asgBulkAll(this.checked)"> Alle</label>'+
    '</div>'+
    '<div id="asg-bulk-list" style="max-height:210px;overflow:auto;display:flex;flex-direction:column;gap:2px">'+rows+'</div>'+
    '<div style="display:flex;gap:8px;align-items:center;margin-top:10px">'+
      '<button type="button" class="btn ghost sm" onclick="asgBulkCancel('+idArg+')">Abbrechen</button>'+
      '<div style="flex:1"></div>'+
      '<span class="muted" id="asg-bulk-count" style="font-size:12.5px">'+(ASG_BULK_SEL.size?ASG_BULK_SEL.size+' ausgew\u00e4hlt':'')+'</span>'+
      '<button type="button" class="btn sm" id="asg-bulk-go"'+(ASG_BULK_SEL.size?'':' disabled')+' onclick="asgBulkApply('+idArg+')">Zuordnen</button>'+
    '</div>'+
  '</div>';
}
function asgBulkToggle(id){ ASG_BULK=true; ASG_BULK_SEL.clear(); refreshAsg(id); }
function asgBulkCancel(id){ ASG_BULK=false; ASG_BULK_SEL.clear(); refreshAsg(id); }
function asgBulkPick(cid,on){ if(on)ASG_BULK_SEL.add(cid); else ASG_BULK_SEL.delete(cid); asgBulkCount(); }
function asgBulkFilter(){
  const q=($('#asg-bulk-q').value||'').toLowerCase();
  document.querySelectorAll('#asg-bulk-list .asg-bulk-row').forEach(r=>{
    r.style.display=r.getAttribute('data-name').includes(q)?'':'none';
  });
}
function asgBulkAll(on){
  document.querySelectorAll('#asg-bulk-list .asg-bulk-row').forEach(r=>{
    if(r.style.display==='none')return;            // nur sichtbare (gefilterte) Zeilen
    const cb=r.querySelector('input'); cb.checked=on;
    if(on)ASG_BULK_SEL.add(cb.value); else ASG_BULK_SEL.delete(cb.value);
  });
  asgBulkCount();
}
function asgBulkCount(){
  const el=$('#asg-bulk-count'); if(el)el.textContent=ASG_BULK_SEL.size?ASG_BULK_SEL.size+' ausgew\u00e4hlt':'';
  const go=$('#asg-bulk-go'); if(go)go.disabled=!ASG_BULK_SEL.size;
}
async function asgBulkApply(id){
  const ids=[...ASG_BULK_SEL]; if(!ids.length){toast('Keine Betriebe ausgew\u00e4hlt');return;}
  if(!id){
    ids.forEach(cid=>{ if(!NEWASG.some(a=>a.customer_id===cid)) NEWASG.push({customer_id:cid,stellenanzeige_id:null}); });
    ASG_BULK=false; ASG_BULK_SEL.clear(); refreshAsg(null); toast(ids.length+' Betriebe zugeordnet'); return;
  }
  if(!state.zuordLoaded){toast('Bitte zuerst SQL v8 ausf\u00fchren (Join-Tabelle fehlt)');return;}
  const rows=ids.map(cid=>({bewerber_id:id,customer_id:cid,stellenanzeige_id:null,status:'gesichtet'}));
  const res=await sb.from('bewerber_zuordnung').insert(rows);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  ASG_BULK=false; ASG_BULK_SEL.clear();
  await reload('zuordnungen'); refreshAsg(id); render(); toast(ids.length+' Betriebe zugeordnet');
}
function asgAddStelleSync(){
  const cid=$('#asg-add-c').value;
  $('#asg-add-s').innerHTML='<option value="">\u2014 Stelle (optional)</option>'+state.stellen.filter(s=>s.customer_id===cid).map(s=>'<option value="'+s.id+'">'+esc(s.titel)+'</option>').join('');
}
function refreshAsg(id){const box=$('#asgBox');if(box)box.innerHTML=asgBoxHtml(id||null);}
async function asgAdd(id){
  const cid=$('#asg-add-c').value; if(!cid){toast('Betrieb w\u00e4hlen');return;}
  const sid=$('#asg-add-s').value||null;
  if(!id){ NEWASG.push({customer_id:cid,stellenanzeige_id:sid}); refreshAsg(null); return; }
  if(!state.zuordLoaded){toast('Bitte zuerst SQL v8 ausf\u00fchren (Join-Tabelle fehlt)');return;}
  const res=await sb.from('bewerber_zuordnung').insert({bewerber_id:id,customer_id:cid,stellenanzeige_id:sid,status:'gesichtet'});
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('zuordnungen'); refreshAsg(id); render(); toast('Betrieb zugeordnet');
}
async function asgRemoveJoin(zid,id){
  const res=await sb.from('bewerber_zuordnung').delete().eq('id',zid);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('zuordnungen'); await syncLegacy(id); await reload('bewerber'); refreshAsg(id); render(); toast('Zuordnung entfernt');
}
async function asgRemoveLegacy(id){
  const res=await sb.from('bewerber').update({customer_id:null,stellenanzeige_id:null}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('bewerber'); refreshAsg(id); render(); toast('Zuordnung entfernt');
}
function asgRemoveNew(i){ NEWASG.splice(i,1); refreshAsg(null); }
async function asgStelleJoin(zid,sid){ const r=await sb.from('bewerber_zuordnung').update({stellenanzeige_id:sid||null}).eq('id',zid); if(!r.error)await reload('zuordnungen'); }
async function asgStelleLegacy(id,sid){ const r=await sb.from('bewerber').update({stellenanzeige_id:sid||null}).eq('id',id); if(!r.error)await reload('bewerber'); }
function asgStelleNew(i,sid){ if(NEWASG[i])NEWASG[i].stellenanzeige_id=sid||null; }
async function syncLegacy(id){
  const b=state.bewerber.find(x=>x.id===id); if(!b)return;
  const rows=asgRows(id);
  if(!rows.some(z=>z.customer_id===b.customer_id)){
    const first=rows[0];
    await sb.from('bewerber').update({customer_id:first?first.customer_id:null,stellenanzeige_id:first?first.stellenanzeige_id:null}).eq('id',id);
  }
}
function extraBlock(extra){
  const keys=extra&&typeof extra==='object'?Object.keys(extra):[];
  if(!keys.length)return '';
  return '<div class="divider"></div><div class="sec-title">Zusatzinfos (aus Import)</div>'+
    '<div class="extragrid">'+keys.map(k=>
      '<div class="extra-k">'+esc(k)+'</div><div class="extra-v">'+esc(extra[k])+'</div>').join('')+'</div>';
}
function bStelleSync(selId){
  const cid=$('#b-cust').value;
  const opts=state.stellen.filter(s=>s.customer_id===cid);
  $('#b-stelle').innerHTML='<option value="">\u2014 keine Stelle</option>'+opts.map(s=>'<option value="'+s.id+'"'+(s.id===selId?' selected':'')+'>'+esc(s.titel)+'</option>').join('');
}
function setStar(n){
  const cur=Number($('#b-rating').value)||0;
  const val=cur===n?0:n; $('#b-rating').value=val;
  [...document.querySelectorAll('#b-stars .star')].forEach(s=>s.classList.toggle('on',Number(s.dataset.n)<=val));
}
async function saveBewerber(id){
  const name=$('#b-name').value.trim(); if(!name){toast('Name fehlt');return;}
  const tags=$('#b-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const payload={name,email:$('#b-email').value.trim(),telefon:$('#b-tel').value.trim(),
    quelle:$('#b-quelle').value,status:$('#b-status').value,rating:Number($('#b-rating').value)||0,tags,
    notizen:$('#b-notiz').value.trim()};
  let res,newId=id;
  if(id){ res=await sb.from('bewerber').update(payload).eq('id',id); }
  else {
    // Erstzuordnung (erste NEWASG) als legacy customer_id mitgeben (Portal/Kompat)
    const first=NEWASG[0];
    if(first){ payload.customer_id=first.customer_id; payload.stellenanzeige_id=first.stellenanzeige_id||null; payload.status='gesichtet'; }
    res=await sb.from('bewerber').insert(payload).select().single();
    newId=res.data&&res.data.id;
  }
  if(res.error){toast('Fehler: '+res.error.message);return;}
  // Mehrfach-Zuordnungen in die Join-Tabelle schreiben (falls v8 vorhanden)
  if(!id && newId && state.zuordLoaded && NEWASG.length){
    const rows=NEWASG.map(a=>({bewerber_id:newId,customer_id:a.customer_id,stellenanzeige_id:a.stellenanzeige_id||null,status:'gesichtet'}));
    const zr=await sb.from('bewerber_zuordnung').insert(rows);
    if(zr.error)toast('Hinweis: Zuordnungen nicht gespeichert ('+zr.error.message+')');
  }
  NEWASG=[];
  await reload('bewerber'); await reload('zuordnungen'); closeModal(); render(); toast(id?'Bewerber gespeichert':'Bewerber angelegt');
}
async function deleteBewerber(id){
  if(!confirm('Bewerber löschen?'))return;
  const res=await sb.from('bewerber').delete().eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('bewerber'); closeModal(); render(); toast('Bewerber gelöscht');
}

/* ===================== CSV-IMPORT (flexibel: alle Spalten wählbar) ===================== */
// Zielfelder. 'extra' = als Zusatzinfo im JSONB-Feld speichern (Spaltenname = Schluessel).
const CSV_TARGETS=[
  {v:'skip',    l:'\u2014 nicht importieren'},
  {v:'name',    l:'Name (komplett) *'},
  {v:'vorname', l:'Vorname *'},
  {v:'nachname',l:'Nachname *'},
  {v:'email',   l:'E-Mail'},
  {v:'telefon', l:'Telefon'},
  {v:'position',l:'Position / gesuchte Stelle'},
  {v:'ort',     l:'Ort'},
  {v:'plz',     l:'PLZ'},
  {v:'erfahrung',l:'Berufserfahrung'},
  {v:'quelle',  l:'Quelle'},
  {v:'status',  l:'Status'},
  {v:'extra',   l:'Als Zusatzinfo speichern'}
];
// Semantische Felder, die als saubere Schluessel ins JSONB "extra" wandern.
const CSV_EXTRA_KEYS={position:'Position',ort:'Ort',plz:'PLZ',erfahrung:'Berufserfahrung'};
// Felder, die nur einmal vergeben werden duerfen.
const CSV_UNIQUE=['name','vorname','nachname','email','telefon','position','ort','plz','erfahrung','quelle','status'];
let CSV={rows:[],headers:[],cols:[],conf:[]}; // cols[i]=Zielfeld, conf[i]='high'|'low' pro Spalte
function openCsvImport(){
  openModal({
    title:'Bewerber importieren', wide:true,
    body:
      '<div class="frow"><label>CSV-/Tabellen-Datei</label><input type="file" id="csv-file" accept=".csv,text/csv,.tsv,text/tab-separated-values" onchange="csvFile(event)"></div>'+
      '<div class="hint">Oder Inhalt direkt einfügen (aus Google Sheets / Excel kopieren = Tab-getrennt, geht auch):</div>'+
      '<div class="frow"><textarea id="csv-text" placeholder="Erste Zeile = Spaltennamen" oninput="csvParse(this.value)"></textarea></div>'+
      '<div id="csv-preview"></div>',
    footer:'<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Abbrechen</button>'+
      '<button class="btn" id="csv-go" onclick="csvImport()" disabled>Importieren</button>'
  });
}
function csvFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csv-text').value=r.result;csvParse(r.result);};r.readAsText(f);}
function csvParse(text){
  text=(text||'').replace(/\s+$/,''); const prev=$('#csv-preview');
  if(!text){if(prev)prev.innerHTML='';CSV={rows:[],headers:[],cols:[],conf:[]};$('#csv-go').disabled=true;return;}
  const first=text.split('\n')[0];
  const sep = first.includes('\t')?'\t':first.includes(';')?';':',';
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out.map(x=>x.trim());};
  const headers=split(lines[0]);
  const rows=lines.slice(1).map(l=>split(l));
  const m=autoMap(headers);
  CSV={headers,rows,cols:m.cols,conf:m.conf};
  renderCsvPreview();
}
// Liefert pro Spalte Default-Ziel + Konfidenz ('high'=sicher erkannt, 'low'=bitte prüfen).
function autoMap(headers){
  const used={};
  const cols=[],conf=[];
  headers.forEach(h=>{
    // Spaltenname normalisieren: Sonderzeichen -> Leerzeichen
    const l=h.toLowerCase().replace(/[?_]/g,' ').replace(/\s+/g,' ').trim();
    let t='extra',c='low';
    if(!used.name && /\bfull ?name\b|^name$|bewerbername|^bewerber$/.test(l)){t='name';c='high';}
    else if(!used.vorname && /vor ?name/.test(l)){t='vorname';c='high';}
    else if(!used.nachname && /nach ?name/.test(l)){t='nachname';c='high';}
    else if(!used.email && /e-?mail/.test(l)){t='email';c='high';}
    else if(!used.telefon && /(phone|telefon|handy|mobil|rufnummer|\bnumber\b)/.test(l)){t='telefon';c='high';}
    else if(!used.ort && /wo suchst/.test(l)){t='ort';c='low';}   // "wo suchst du... (ort oder plz)" -> mehrdeutig, vor PLZ prüfen
    else if(!used.plz && /(plz|postleitzahl)/.test(l)){t='plz';c='high';}
    else if(!used.ort && /(^ort$|\bort\b|wohnort|stadt|standort)/.test(l)){t='ort';c='high';}
    else if(!used.position && /(interessant|gesuchte stelle|stellenwunsch)/.test(l)){t='position';c='high';}
    else if(!used.position && /(position|^stelle$|stellen)/.test(l)){t='position';c='high';}
    else if(!used.position && /fachrichtung/.test(l)){t='position';c='low';} // Kategorie, nicht exakte Rolle -> prüfen
    else if(!used.erfahrung && /(berufserfahrung|erfahrung)/.test(l)){t='erfahrung';c='low';} // Inhalt variiert je Quelle -> prüfen
    else if(!used.quelle && /(platform|quelle|^source$)/.test(l)){t='quelle';c='high';}
    else if(!used.status && /(lead ?status|^status$)/.test(l)){t='status';c='high';}
    // technische Meta-/Form-Felder standardmaessig nicht importieren
    else if(/(^id$| id$|created time|is organic|ad name|adset|campaign|form id|form name|zeitstempel)/.test(l)){t='skip';c='high';}
    else {t='extra';c='low';}
    if(CSV_UNIQUE.includes(t)) used[t]=true;
    cols.push(t); conf.push(c);
  });
  return {cols,conf};
}
function csvSet(i,v){
  // Unique-Felder sind 1x vergeben -> bei Doppelung andere zuruecksetzen
  if(CSV_UNIQUE.includes(v)){
    CSV.cols=CSV.cols.map((c,idx)=> (idx!==i && c===v)? 'extra' : c);
  }
  CSV.cols[i]=v; CSV.conf[i]='high'; // manuell gesetzt = bestätigt
  renderCsvPreview();
}

function normQuelle(v){
  const l=(v||'').toLowerCase();
  if(/gehaltscheck|gehalts-?check/.test(l))return 'gehaltscheck';
  if(/ig|insta|fb|face|meta/.test(l))return 'meta';
  if(/indeed/.test(l))return 'indeed';
  if(/web/.test(l))return 'website';
  if(QUELLE.includes(l))return l;
  return 'csv';
}
function cleanPhone(v){
  return (v||'').replace(/^p:/i,'').replace(/[^\d+ ()/-]/g,'').replace(/\s+/g,' ').trim();
}
function normStatus(v){
  const l=(v||'').toLowerCase();
  const hit=STATUS.find(s=>s.id===l||s.label.toLowerCase()===l);
  return hit?hit.id:'neu';
}
async function csvImport(){
  const hasName=CSV.cols.includes('name')||(CSV.cols.includes('vorname')&&CSV.cols.includes('nachname'));
  if(!hasName){toast('Spalte "Name" (oder Vorname + Nachname) zuordnen');return;}
  const cid=$('#csv-cust')?.value||null;
  const quOver=$('#csv-quelle')?.value||'';
  const idx=t=>CSV.cols.indexOf(t);
  const payload=CSV.rows.map(r=>{
    const cell=t=>{const k=idx(t);return k>=0?(r[k]||'').trim():'';};
    // Name: komplett oder aus Vorname + Nachname
    const name = idx('name')>=0 ? cell('name') : [cell('vorname'),cell('nachname')].filter(Boolean).join(' ').trim();
    const extra={};
    // freie Zusatz-Spalten
    CSV.cols.forEach((c,i)=>{ if(c==='extra'){ const val=(r[i]||'').trim(); if(val) extra[CSV.headers[i]]=val; } });
    // semantische Felder unter sauberen Schluesseln
    Object.keys(CSV_EXTRA_KEYS).forEach(t=>{ const v=cell(t); if(v) extra[CSV_EXTRA_KEYS[t]]=v; });
    return {
      name,
      email:cell('email')||null,
      telefon: cleanPhone(cell('telefon'))||null,
      quelle: quOver ? quOver : (idx('quelle')>=0? normQuelle(cell('quelle')) : 'csv'),
      status: idx('status')>=0? normStatus(cell('status')) : 'neu',
      customer_id:cid||null,
      extra
    };
  }).filter(p=>p.name);
  if(!payload.length){toast('Keine gültigen Zeilen (Name leer?)');return;}
  $('#csv-go').disabled=true; $('#csv-go').textContent='Importiere...';
  // in Batches zu 500 (große Sheets)
  let done=0;
  for(let i=0;i<payload.length;i+=500){
    const res=await sb.from('bewerber').insert(payload.slice(i,i+500));
    if(res.error){toast('Fehler: '+res.error.message);$('#csv-go').disabled=false;$('#csv-go').textContent='Importieren';return;}
    done+=Math.min(500,payload.length-i);
  }
  await reload('bewerber'); closeModal(); render(); toast(done+' Bewerber importiert');
}

          '<button class="btn ghost sm" onclick="mmSelAllB()">Alle</button>'+

        '<div style="padding:10px 14px;border-bottom:1px solid var(--line)"><input id="mm-qb" placeholder="Bewerber / Ort / PLZ / Stelle suchen\u2026" value="'+esc(MM.qB)+'" oninput="mmSetQB(this.value)" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px"></div>'+
        '<div id="mm-b-list" style="max-height:60vh;overflow:auto"></div>'+
      '</div>'+
      '<div class="card" style="padding:0;overflow:hidden">'+
        '<div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
          '<b>Betriebe</b><span class="tag-s gray" id="mm-c-count">0</span><div style="flex:1"></div>'+
          '<select onchange="mmSetRadius(this.value)" style="padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12.5px">'+radOpts+'</select>'+
          '<button class="btn ghost sm" onclick="mmSelAllC()">Alle</button>'+
        '</div>'+
        '<div style="padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">'+

          '<input id="mm-qs" placeholder="sucht Stelle (z.B. Kanalbauer)\u2026" value="'+esc(MM.qStelle)+'" oninput="mmSetQS(this.value)" style="flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px">'+
        '</div>'+
        '<div id="mm-c-list" style="max-height:60vh;overflow:auto"></div>'+
