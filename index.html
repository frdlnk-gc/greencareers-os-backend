<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>GreenCareers OS Backend</title>
<style>
:root{
  --green:#16A34A; --green-2:#15803D; --ink:#0B1A12; --ink-2:#10231A;
  --sidebar:#0C1B13; --sidebar-2:#102619; --sidebar-text:#9DBCA8;
  --canvas:#F4F6F4; --card:#FFFFFF; --line:#E3E8E3; --line-2:#EDF1ED;
  --text:#16261C; --muted:#6B7C70; --soft:#EAF6EE; --danger:#DC2626;
  --radius:14px; --shadow:0 1px 3px rgba(16,38,25,.06),0 8px 24px rgba(16,38,25,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--canvas);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--green);text-decoration:none}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,#16341f 0%,var(--ink) 60%);padding:24px;z-index:50}
.loginbox{width:100%;max-width:400px;background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.4);padding:34px 30px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:17px;letter-spacing:-.2px}
.loginbox .tag{display:inline-block;margin:4px 0 22px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-2);background:var(--soft);padding:4px 9px;border-radius:999px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--green);color:#fff;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:9px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid #F1C7C7}
.btn.danger:hover{background:#FEF2F2}
.loginmsg{margin-top:12px;font-size:13px;min-height:18px}
.loginmsg.err{color:var(--danger)}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.sidebar .top{padding:20px 18px 14px}
.sidebar .brand b{color:#fff}
.sidebar .brand .dot{background:var(--green)}
.sidebar .env{font-size:11px;color:#5f7a68;margin-top:8px;padding-left:2px}
.nav{padding:8px 12px;flex:1;overflow:auto}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--sidebar-text);font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:2px;transition:background .12s,color .12s}
.navitem:hover{background:var(--sidebar-2);color:#fff}
.navitem.active{background:var(--green);color:#fff}
.navitem .ic{width:18px;text-align:center;font-size:16px}
.navitem .ct{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;font-weight:700}
.sidebar .bottom{padding:14px;border-top:1px solid rgba(255,255,255,.06)}
.who{font-size:13px;color:#cfe3d6;margin-bottom:8px;word-break:break-all}
.who small{display:block;color:#6f8c79;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px;letter-spacing:-.3px;font-weight:800}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
.topbar .spacer{flex:1}
.content{padding:24px 26px 60px;max-width:1180px;width:100%}

/* ---------- CARDS / TABLES ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .n{font-size:28px;font-weight:800;letter-spacing:-1px}
.stat .l{color:var(--muted);font-size:13px;margin-top:2px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:180px;position:relative}
.toolbar .search input{width:100%;padding:10px 13px 10px 36px;border:1px solid var(--line);border-radius:11px;background:#fff;outline:none}
.toolbar .search input:focus{border-color:var(--green)}
.toolbar .search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
table{width:100%;border-collapse:collapse}
.tablecard{overflow:hidden}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--line-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--soft)}
.tag-s{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.tag-s.green{background:var(--soft);color:var(--green-2)}
.tag-s.orange{background:#FEF0E6;color:#C2410C}
.tag-s.gold{background:#FBF3D8;color:#A16207}
.tag-s.blue{background:#E6F0FB;color:#1D5FB0}
.tag-s.gray{background:var(--line-2);color:var(--muted)}
.tag-s.red{background:#FEECEC;color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px}
.muted{color:var(--muted)}
.right{text-align:right}

/* ---------- MODAL ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(11,26,18,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .15s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px;font-weight:800;letter-spacing:-.2px}
.modal-h .x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:18px;display:grid;place-items:center}
.modal-h .x:hover{background:var(--line-2)}
.modal-b{padding:22px 24px;max-height:64vh;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line);background:var(--line-2);border-radius:0 0 18px 18px}
.modal-f .spacer{flex:1}
.frow{margin-bottom:15px}
.frow label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--green)}
.frow textarea{min-height:80px;resize:vertical}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.selchips{display:flex;flex-wrap:wrap;gap:7px}
.selchip{padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;background:#fff;color:var(--muted)}
.selchip.on{background:var(--soft);border-color:var(--green);color:var(--green-2)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.divider{height:1px;background:var(--line);margin:18px 0}
.sec-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 10px}

/* CSV preview */
.csvtable{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:240px}
.csvtable table{font-size:13px}
.csvtable th,.csvtable td{padding:8px 10px;white-space:nowrap}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:8px}
.maprow .col{font-size:13px;font-weight:600;background:var(--line-2);padding:7px 10px;border-radius:8px;min-width:0}
.maprow.off{opacity:.5}
.maprow select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.extragrid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.extra-k{color:var(--muted);font-weight:600}
.extra-v{color:var(--text);word-break:break-word}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink-2);color:#fff;padding:12px 18px;border-radius:11px;font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:80;animation:pop .15s ease}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 50px rgba(0,0,0,.4)}
  .sidebar.open{transform:translateX(0)}
  .menubtn{display:grid!important}
  .stats{grid-template-columns:repeat(2,1fr)}
  .content{padding:18px 16px 60px}
  .topbar{padding:14px 16px}
  .frow2{grid-template-columns:1fr}
  .hide-sm{display:none}
}
.menubtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;place-items:center;font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}

/* ---------- DETAIL / COCKPIT ---------- */
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;cursor:pointer}
.backlink:hover{color:var(--green-2)}
.dhead{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.dhead .av{width:54px;height:54px;border-radius:14px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex-shrink:0}
.dhead h2{font-size:22px;font-weight:800;letter-spacing:-.3px}
.dhead .meta{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cardh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cardh b{font-size:15px}
.cardh .btn{margin-left:auto}
.cardp{padding:16px 18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 14px;font-size:14px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{color:var(--text);word-break:break-word}
.modgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
.modrow .mt{flex:1;min-width:0}
.modrow .mt b{font-size:14px;display:block}
.modrow .mt small{color:var(--muted);font-size:11.5px}
.switch{position:relative;width:40px;height:23px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd8d0;border-radius:999px;transition:.18s;cursor:pointer}
.slider:before{content:'';position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(17px)}
.listrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.listrow:last-child{border-bottom:none}
.listrow .lt{flex:1;min-width:0}
.listrow .lt b{font-size:14px}
.listrow .lt small{display:block;color:var(--muted);font-size:12px}
.tk-prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tk-prio.niedrig{background:#9CA3AF}.tk-prio.mittel{background:#16A34A}.tk-prio.hoch{background:#EA580C}.tk-prio.dringend{background:#DC2626}
.stars{display:inline-flex;gap:2px}
.star{cursor:pointer;font-size:18px;color:#D7DED8;line-height:1}
.star.on{color:#F5B301}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:#fff;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
.tagpill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--green-2)}
.tagpill .rm{cursor:pointer;opacity:.6}.tagpill .rm:hover{opacity:1}
/* Kanban */
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--line-2);border-radius:13px;min-height:120px;display:flex;flex-direction:column}
.kcolh{padding:11px 13px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;align-items:center;gap:7px;position:sticky;top:0}
.kcolh .n{margin-left:auto;background:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.kcol.drag{outline:2px dashed var(--green);outline-offset:-3px}
.kbody{padding:0 9px 9px;display:flex;flex-direction:column;gap:8px;flex:1}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:grab;box-shadow:0 1px 2px rgba(16,38,25,.05)}
.kcard:active{cursor:grabbing}
.kcard b{font-size:13.5px}
.kcard .sub{color:var(--muted);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .kf{display:flex;align-items:center;gap:6px;margin-top:7px}
.miniquelle{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.csvbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pwbox{background:var(--soft);border:1px solid #CDEBD8;border-radius:11px;padding:13px 15px;font-size:13.5px}
.pwbox code{background:#fff;border:1px solid var(--line);padding:3px 8px;border-radius:7px;font-weight:700;font-size:14px;letter-spacing:.5px}
@media(max-width:860px){.grid2,.modgrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="loginbox">
    <div class="brand"><span class="dot">G</span><b>GreenCareers OS</b></div>
    <span class="tag">Backend · Intern</span>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="field"><label>E-Mail</label><input id="li-email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Passwort</label><input id="li-pw" type="password" autocomplete="current-password" required></div>
      <button class="btn full" type="submit" id="li-btn">Anmelden</button>
      <div class="loginmsg" id="li-msg"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="top">
      <div class="brand"><span class="dot">G</span><b>OS Backend</b></div>
      <div class="env">Recruiting-Operations</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="bottom">
      <div class="who" id="who"></div>
      <button class="btn ghost sm full" onclick="doLogout()">Abmelden</button>
    </div>
  </aside>
  <div class="scrim hidden" id="scrim" onclick="toggleNav(false)"></div>
  <main class="main">
    <header class="topbar">
      <button class="menubtn" onclick="toggleNav(true)">&#9776;</button>
      <div>
        <h1 id="pgTitle">Dashboard</h1>
        <div class="sub" id="pgSub"></div>
      </div>
      <div class="spacer"></div>
      <div id="pgActions"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===================== SUPABASE ===================== */
const SUPABASE_URL = 'https://tfoopogxaqvfwbonabpi.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmb29wb2d4YXF2Zndib25hYnBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNTQzMjQsImV4cCI6MjA5NjgzMDMyNH0.udWRPszXVOj7EG4bspmsU9HXbZYFRDn8QO9kZi2tw8M';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

/* ===================== STATE ===================== */
const state = {
  profile:null, view:'dashboard',
  customers:[], stellen:[], bewerber:[], branchen:[], tickets:[], activity:[], users:[],
  search:'', filterCustomer:'all', selCustomer:null, bewView:'tabelle'
};
const STATUS = [
  {id:'neu',label:'Neu',c:'gray'},
  {id:'gesichtet',label:'Gesichtet',c:'blue'},
  {id:'qualifiziert',label:'Qualifiziert',c:'green'},
  {id:'anrufen',label:'Anrufen',c:'gold'},
  {id:'vorgestellt',label:'Vorgestellt',c:'blue'},
  {id:'eingestellt',label:'Eingestellt',c:'green'},
  {id:'abgesagt',label:'Abgesagt',c:'red'}
];
const QUELLE = ['indeed','meta','manuell','csv','website'];
const THEME_TAG = {galabau:'green',tiefbau:'orange',landwirtschaft:'gold'};
const MODULES = [
  {id:'heute',  label:'Heute',    desc:'Tages-Cockpit, Wetter, Stempeluhr'},
  {id:'team',   label:'Team',     desc:'Personalakte & Abwesenheiten'},
  {id:'planung',label:'Planung',  desc:'Plantafel & Einsatzplanung'},
  {id:'kunden', label:'Kunden',   desc:'Auftraege & Angebote'},
  {id:'finanzen',label:'Finanzen',desc:'Umsaetze & Rechnungen'},
  {id:'markt',  label:'Markt',    desc:'Recruiting-Marktplatz'}
];
const PLANS = [
  {v:'free',l:'Free',c:'gray'},{v:'basis',l:'Basis',c:'green'},
  {v:'pro',l:'Pro',c:'blue'},{v:'enterprise',l:'Enterprise',c:'gold'}
];
const ABO_STATUS = [
  {v:'testphase',l:'Testphase',c:'gold'},{v:'aktiv',l:'Aktiv',c:'green'},
  {v:'pausiert',l:'Pausiert',c:'gray'},{v:'gekuendigt',l:'Gekuendigt',c:'red'}
];
const ONBOARDING = [
  {v:'neu',l:'Neu',c:'gray'},{v:'onboarding',l:'Onboarding',c:'gold'},
  {v:'live',l:'Live',c:'green'},{v:'inaktiv',l:'Inaktiv',c:'red'}
];
const TICKET_STATUS = [
  {v:'offen',l:'Offen',c:'gold'},{v:'in_arbeit',l:'In Arbeit',c:'blue'},
  {v:'wartet',l:'Wartet',c:'gray'},{v:'geloest',l:'Geloest',c:'green'}
];
const TICKET_PRIO = ['niedrig','mittel','hoch','dringend'];
const defaultModules = ()=>({heute:true,team:true,planung:false,kunden:false,finanzen:false,markt:false});
function lookup(arr,v){return arr.find(x=>x.v===v)||{l:v,c:'gray'};}

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cust = id => state.customers.find(c=>c.id===id);
const stelleById = id => state.stellen.find(s=>s.id===id);
const statusOf = id => STATUS.find(s=>s.id===id) || {label:id,c:'gray'};
function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>r.innerHTML='',2200);}
function fmtDate(d){if(!d)return '';const x=new Date(d);return x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtEUR(n){return (Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});}
function initials(s){return (s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';}
function genPw(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ',b='abcdefghijkmnpqrstuvwxyz',d='23456789',s='!@#$%';const pick=x=>x[Math.floor(Math.random()*x.length)];let p=pick(a)+pick(b)+pick(b)+pick(b)+pick(d)+pick(d)+pick(s)+pick(b)+pick(d);return p;}
/* Edge Function fuer User-Provisioning (service_role bleibt server-seitig) */
async function callAdmin(action,payload={}){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) throw new Error('Keine Session');
  const res=await fetch(SUPABASE_URL+'/functions/v1/admin-users',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON},
    body:JSON.stringify(Object.assign({action},payload))
  });
  let j={}; try{j=await res.json();}catch(e){}
  if(!res.ok||j.error) throw new Error(j.error||('HTTP '+res.status));
  return j;
}

/* ===================== AUTH ===================== */
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(session) await afterLogin(); else showLogin();
}
function showLogin(){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); }

async function doLogin(e){
  e.preventDefault();
  const msg=$('#li-msg'); const btn=$('#li-btn');
  msg.className='loginmsg'; msg.textContent=''; btn.disabled=true; btn.textContent='Pruefe...';
  const email=$('#li-email').value.trim(); const pw=$('#li-pw').value;
  const {error} = await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false; btn.textContent='Anmelden';
  if(error){ msg.className='loginmsg err'; msg.textContent='Login fehlgeschlagen: '+error.message; return; }
  await afterLogin();
}

async function afterLogin(){
  const {data:{user}} = await sb.auth.getUser();
  const {data:prof,error} = await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error || !prof){ await sb.auth.signOut(); $('#li-msg').className='loginmsg err'; $('#li-msg').textContent='Kein Profil gefunden.'; showLogin(); return; }
  if(prof.role!=='gc_admin'){
    await sb.auth.signOut(); showLogin();
    $('#li-msg').className='loginmsg err';
    $('#li-msg').textContent='Dieser Login ist nur fuer GreenCareers-Mitarbeiter (gc_admin).';
    return;
  }
  state.profile=prof;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').innerHTML='<b>'+esc(prof.name||prof.email)+'</b><small>GC-Admin · Vollzugriff</small>';
  await loadAll();
  setView('dashboard');
}
async function doLogout(){ await sb.auth.signOut(); state.profile=null; showLogin(); $('#li-pw').value=''; }

/* ===================== DATA ===================== */
async function loadAll(){
  const [c,s,b,br,tk,ac,pr] = await Promise.all([
    sb.from('customers').select('*').order('name'),
    sb.from('stellenanzeigen').select('*').order('created_at',{ascending:false}),
    sb.from('bewerber').select('*').order('created_at',{ascending:false}),
    sb.from('branchen').select('*').order('sort'),
    sb.from('support_tickets').select('*').order('created_at',{ascending:false}),
    sb.from('activity_log').select('*').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('created_at',{ascending:false})
  ]);
  state.customers = c.data||[]; state.stellen = s.data||[];
  state.bewerber = b.data||[]; state.branchen = br.data||[];
  state.tickets = tk.data||[]; state.activity = ac.data||[]; state.users = pr.data||[];
}
async function reload(table){
  if(table==='customers'){const {data}=await sb.from('customers').select('*').order('name');state.customers=data||[];}
  if(table==='stellen'){const {data}=await sb.from('stellenanzeigen').select('*').order('created_at',{ascending:false});state.stellen=data||[];}
  if(table==='bewerber'){const {data}=await sb.from('bewerber').select('*').order('created_at',{ascending:false});state.bewerber=data||[];}
  if(table==='tickets'){const {data}=await sb.from('support_tickets').select('*').order('created_at',{ascending:false});state.tickets=data||[];}
  if(table==='activity'){const {data}=await sb.from('activity_log').select('*').order('created_at',{ascending:false});state.activity=data||[];}
  if(table==='users'){const {data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});state.users=data||[];}
}

function renderNav(){

    let ct='';

async function saveCustomerField(id,field,val){
  if(field==='mrr') val=Number(val)||0;
  if(field==='vertrag_start' && !val) val=null;
  const res=await sb.from('customers').update({[field]:val}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('customers'); toast('Gespeichert');
}
async function toggleModule(id,mod,on){
  const c=cust(id); const mods=Object.assign(defaultModules(),c.modules||{}); mods[mod]=on;
  const res=await sb.from('customers').update({modules:mods}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('customers'); toast((on?'Freigeschaltet: ':'Gesperrt: ')+mod);
}

function viewBewerber(){

  const q=state.search.toLowerCase();

  const seg='<div class="toolbar"><div class="search"><span class="si">\u2315</span><input placeholder="Bewerber suchen..." value="'+esc(state.search)+'" oninput="state.search=this.value;render()"></div>'+
    '<div class="seg"><button class="'+(state.bewView==='tabelle'?'on':'')+'" onclick="state.bewView=\'tabelle\';render()">Tabelle</button>'+
    '<button class="'+(state.bewView==='pipeline'?'on':'')+'" onclick="state.bewView=\'pipeline\';render()">Pipeline</button></div></div>';
  if(state.bewView==='pipeline'){
    $('#content').innerHTML=seg+renderBoard(rows);
    return;
  }
  $('#content').innerHTML=seg+'<div class="card tablecard">'+tableBewerber(rows,true,true)+'</div>';
}
function renderBoard(rows){
  return '<div class="board">'+STATUS.map(col=>{
    const items=rows.filter(b=>b.status===col.id);
    return '<div class="kcol" data-status="'+col.id+'" ondragover="kDragOver(event)" ondragleave="kDragLeave(event)" ondrop="kDrop(event,\''+col.id+'\')">'+
      '<div class="kcolh"><span class="tag-s '+col.c+'" style="font-size:11px">'+esc(col.label)+'</span><span class="n">'+items.length+'</span></div>'+
      '<div class="kbody">'+items.map(b=>
        '<div class="kcard" draggable="true" ondragstart="kDragStart(event,\''+b.id+'\')" onclick="editBewerber(\''+b.id+'\')">'+
        '<b>'+esc(b.name)+'</b>'+
        '<div class="sub">'+esc(cust(b.customer_id)?.name||'\u2014 offen')+'</div>'+
        '<div class="kf"><span class="miniquelle">'+esc(b.quelle||'manuell')+'</span>'+(b.rating?'<span class="stars">'+'\u2605'.repeat(b.rating)+'</span>':'')+'</div>'+
        '</div>'
      ).join('')+'</div></div>';
  }).join('')+'</div>';
}
let DRAG_ID=null;
function kDragStart(e,id){ DRAG_ID=id; e.dataTransfer.effectAllowed='move'; }
function kDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag'); }
function kDragLeave(e){ e.currentTarget.classList.remove('drag'); }
async function kDrop(e,status){
  e.preventDefault(); e.currentTarget.classList.remove('drag');
  if(!DRAG_ID)return; const id=DRAG_ID; DRAG_ID=null;
  const b=state.bewerber.find(x=>x.id===id); if(!b||b.status===status)return;
  b.status=status; render();
  const res=await sb.from('bewerber').update({status}).eq('id',id);
  if(res.error){toast('Fehler: '+res.error.message);await reload('bewerber');render();return;}
  await reload('bewerber'); toast('Status: '+statusOf(status).label);
}
function tableBewerber(rows, showCust, clickable){
  if(!rows.length) return empty('\u263A','Keine Bewerber','Pflege Bewerber ein oder importiere eine CSV.');
  return '<table><thead><tr><th>Name</th><th class="hide-sm">Kontakt</th>'+(showCust?'<th>Kunde</th>':'')+'<th>Quelle</th><th>Status</th></tr></thead><tbody>'+
    rows.map(b=>{
      const st=statusOf(b.status);
      const click = clickable!==false? 'onclick="editBewerber(\''+b.id+'\')"':'';
      return '<tr '+click+'><td><b>'+esc(b.name)+'</b></td>'+
        '<td class="hide-sm muted">'+esc(b.email||'')+(b.telefon?'<br>'+esc(b.telefon):'')+'</td>'+
        (showCust?'<td>'+(b.customer_id?esc(cust(b.customer_id)?.name||'?'):'<span class="tag-s gold">offen</span>')+'</td>':'')+
        '<td><span class="tag-s gray">'+esc(b.quelle||'manuell')+'</span></td>'+
        '<td><span class="tag-s '+st.c+'">'+esc(st.label)+'</span></td></tr>';
    }).join('')+'</tbody></table>';
}

      '<div class="frow2"><div class="frow"><label>E-Mail</label><input id="b-email" value="'+esc(b.email||'')+'"></div>'+

/* ===================== CSV-IMPORT (flexibel: alle Spalten waehlbar) ===================== */
// Zielfelder. 'extra' = als Zusatzinfo im JSONB-Feld speichern (Spaltenname = Schluessel).
const CSV_TARGETS=[
  {v:'skip',  l:'\u2014 nicht importieren'},
  {v:'name',  l:'Name *'},
  {v:'email', l:'E-Mail'},
  {v:'telefon',l:'Telefon'},
  {v:'quelle',l:'Quelle'},
  {v:'status',l:'Status'},
  {v:'extra', l:'Als Zusatzinfo speichern'}
];
let CSV={rows:[],headers:[],cols:[]}; // cols[i] = Zielfeld pro Spalte
function openCsvImport(){
  openModal({
    title:'Bewerber importieren', wide:true,
    body:
      '<div class="frow"><label>CSV-/Tabellen-Datei</label><input type="file" id="csv-file" accept=".csv,text/csv,.tsv,text/tab-separated-values" onchange="csvFile(event)"></div>'+
      '<div class="hint">Oder Inhalt direkt einfuegen (aus Google Sheets / Excel kopieren = Tab-getrennt, geht auch):</div>'+
      '<div class="frow"><textarea id="csv-text" placeholder="Erste Zeile = Spaltennamen" oninput="csvParse(this.value)"></textarea></div>'+
      '<div id="csv-preview"></div>',
    footer:'<div class="spacer"></div><button class="btn ghost" onclick="closeModal()">Abbrechen</button>'+
      '<button class="btn" id="csv-go" onclick="csvImport()" disabled>Importieren</button>'
  });
}
function csvFile(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csv-text').value=r.result;csvParse(r.result);};r.readAsText(f);}
function csvParse(text){
  text=(text||'').replace(/\s+$/,''); const prev=$('#csv-preview');
  if(!text){if(prev)prev.innerHTML='';CSV={rows:[],headers:[],cols:[]};$('#csv-go').disabled=true;return;}
  const first=text.split('\n')[0];
  const sep = first.includes('\t')?'\t':first.includes(';')?';':',';
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out.map(x=>x.trim());};
  const headers=split(lines[0]);
  const rows=lines.slice(1).map(l=>split(l));
  CSV={headers,rows,cols:autoMap(headers)};
  renderCsvPreview();
}
// Liefert pro Spalte das Default-Ziel.
function autoMap(headers){
  let nameUsed=false,mailUsed=false,telUsed=false,quUsed=false,stUsed=false;
  return headers.map(h=>{
    const l=h.toLowerCase();
    if(!nameUsed&&/(full_?name|^name$|vor.?name|nach.?name|bewerber)/.test(l)){nameUsed=true;return 'name';}
    if(!mailUsed&&/(e-?mail|email)/.test(l)){mailUsed=true;return 'email';}
    if(!telUsed&&/(phone|telefon|handy|mobil|rufnummer|number)/.test(l)){telUsed=true;return 'telefon';}
    if(!quUsed&&/(platform|quelle|source|kanal)/.test(l)){quUsed=true;return 'quelle';}
    if(!stUsed&&/(lead_?status|^status$)/.test(l)){stUsed=true;return 'status';}
    // technische Meta-Felder standardmaessig nicht importieren
    if(/(^id$|_id$|created_time|is_organic|ad_name|adset|campaign_id|form_id)/.test(l)) return 'skip';
    return 'extra';
  });
}
function csvSet(i,v){
  // Name/E-Mail/Telefon/Quelle/Status sind 1x vergeben -> bei Doppelung andere zuruecksetzen
  if(['name','email','telefon','quelle','status'].includes(v)){
    CSV.cols=CSV.cols.map((c,idx)=> (idx!==i && c===v)? 'extra' : c);
  }
  CSV.cols[i]=v; renderCsvPreview();
}
function renderCsvPreview(){
  const custOpts='<option value="">\u2014 spaeter zuordnen</option>'+state.customers.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');
  const nImp=CSV.cols.filter(c=>c!=='skip').length;
  const hasName=CSV.cols.includes('name');
  const rowsHtml=CSV.headers.map((h,i)=>{
    const sample=(CSV.rows.find(r=>(r[i]||'').trim())||[])[i]||'';
    const sel=CSV.cols[i];
    const opts=CSV_TARGETS.map(t=>'<option value="'+t.v+'"'+(t.v===sel?' selected':'')+'>'+t.l+'</option>').join('');
    return '<div class="maprow'+(sel==='skip'?' off':'')+'">'+
      '<div class="col"><b>'+esc(h)+'</b><div class="muted" style="font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(sample)+'</div></div>'+
      '<select onchange="csvSet('+i+',this.value)">'+opts+'</select></div>';
  }).join('');
  $('#csv-preview').innerHTML=
    '<div class="divider"></div>'+
    '<div class="sec-title">Spalten zuordnen <span class="muted" style="text-transform:none;font-weight:500">('+nImp+' von '+CSV.headers.length+' aktiv \u00B7 '+CSV.rows.length+' Zeilen)</span></div>'+
    '<div class="hint" style="margin-bottom:10px">Pro Spalte waehlen: Standardfeld, "Zusatzinfo" (bleibt am Bewerber gespeichert) oder "nicht importieren".</div>'+
    rowsHtml+
    '<div class="frow" style="margin-top:14px"><label>Alle diesem Kunden zuordnen (optional)</label><select id="csv-cust">'+custOpts+'</select></div>'+
    (hasName?'':'<div class="hint" style="color:var(--danger)">Mindestens eine Spalte muss "Name" sein.</div>');
  $('#csv-go').disabled = !hasName;
}
function normQuelle(v){
  const l=(v||'').toLowerCase();
  if(/ig|insta|fb|face|meta/.test(l))return 'meta';
  if(/indeed/.test(l))return 'indeed';
  if(/web/.test(l))return 'website';
  if(QUELLE.includes(l))return l;
  return 'csv';
}
function normStatus(v){
  const l=(v||'').toLowerCase();
  const hit=STATUS.find(s=>s.id===l||s.label.toLowerCase()===l);
  return hit?hit.id:'neu';
}
async function csvImport(){
  if(!CSV.cols.includes('name')){toast('Spalte "Name" zuordnen');return;}
  const cid=$('#csv-cust')?.value||null;
  const idx=t=>CSV.cols.indexOf(t);
  const payload=CSV.rows.map(r=>{
    const cell=t=>{const k=idx(t);return k>=0?(r[k]||'').trim():'';};
    const extra={};
    CSV.cols.forEach((c,i)=>{ if(c==='extra'){ const val=(r[i]||'').trim(); if(val) extra[CSV.headers[i]]=val; } });
    return {
      name:cell('name'),
      email:cell('email')||null,
      telefon:cell('telefon')||null,
      quelle: idx('quelle')>=0? normQuelle(cell('quelle')) : 'csv',
      status: idx('status')>=0? normStatus(cell('status')) : 'neu',
      customer_id:cid||null,
      extra
    };
  }).filter(p=>p.name);
  if(!payload.length){toast('Keine gueltigen Zeilen (Name leer?)');return;}
  $('#csv-go').disabled=true; $('#csv-go').textContent='Importiere...';
  // in Batches zu 500 (grosse Sheets)
  let done=0;
  for(let i=0;i<payload.length;i+=500){
    const res=await sb.from('bewerber').insert(payload.slice(i,i+500));
    if(res.error){toast('Fehler: '+res.error.message);$('#csv-go').disabled=false;$('#csv-go').textContent='Importieren';return;}
    done+=Math.min(500,payload.length-i);
  }
  await reload('bewerber'); closeModal(); render(); toast(done+' Bewerber importiert');
}

    '<div class="card tablecard">'+
      tableBewerber(state.bewerber.filter(b=>b.customer_id&&(state.filterCustomer==='all'||b.customer_id===state.filterCustomer)),true)+
    '</div>';

function mStelle(bid){
  const cid=$('#m-c-'+bid).value;

  $('#m-s-'+bid).innerHTML='<option value="">\u2014 keine Stelle</option>'+opts.map(s=>'<option value="'+s.id+'">'+esc(s.titel)+'</option>').join('');
}
async function mAssign(bid){
  const cid=$('#m-c-'+bid).value; if(!cid){toast('Kunde waehlen');return;}
  const sid=$('#m-s-'+bid).value||null;
  const res=await sb.from('bewerber').update({customer_id:cid,stellenanzeige_id:sid,status:'gesichtet'}).eq('id',bid);
  if(res.error){toast('Fehler: '+res.error.message);return;}
  await reload('bewerber'); render(); toast('Bewerber zugeordnet');
}

function openTicket(id){

  openModal({title:esc(t.betreff),

      '<div class="frow"><label>Status</label><select id="tk-status">'+TICKET_STATUS.map(s=>'<option value="'+s.v+'"'+(s.v===t.status?' selected':'')+'>'+s.l+'</option>').join('')+'</select></div>'+
